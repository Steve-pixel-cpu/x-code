[project]
name = "x-code"
version = "3.3.8"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "openai>=1.60.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tzdata>=2026.4",
    "trafilatura>=2.0",
    "websearch-py>=0.1.0",
    "playwright>=1.49",
    "mcp>=1.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
