[package]
name = "x-code"
version = "0.1.0"
description = "x-code 桌面壳（Tauri 版）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# 原生"选择文件夹"对话框（对应 Electron 版 preload 桥的 pick-folder）
rfd = "0.15"

[profile.release]
strip = true
lto = true
codegen-units = 1
