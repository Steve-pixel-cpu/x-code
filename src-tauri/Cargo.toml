[package]
name = "x-code"
version = "3.3.1"
description = "x-code 桌面壳（Tauri 版）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# 右键菜单的"粘贴": 读系统剪贴板走 Rust 侧, 避开 WebView2 剪贴板读权限弹窗
tauri-plugin-clipboard-manager = "2"
# 原生"选择文件夹"对话框（对应 Electron 版 preload 桥的 pick-folder）
rfd = "0.15"
# 系统原生桌面通知: WebView2 未实现 Web Notification API, 前端的
# new Notification() 在壳里静默失败——由壳内 notify_desktop 命令代发
tauri-plugin-notification = "2"
# 应用内自动更新: 启动检查 + 签名校验 + NSIS 被动安装。经自定义命令
# (check_update/install_update/update_status)暴露给前端, 不用插件的 JS 绑定
tauri-plugin-updater = "2"
# 更新命令的返回值结构（tauri 内部也用它, 但命令签名直接引用需显式依赖）
serde_json = "1"

# 关闭 WebView2 浏览器快捷键（F5/Ctrl+R 刷新等, tauri 未透传该设置）
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
