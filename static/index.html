<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>x-code</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.js"></script>
<style>
  /* ============ 设计令牌（参考图: 白色主区 + 浅灰侧栏 + 橙色点缀） ============ */
  :root {
    --bg: #ffffff;
    --side-bg: #f9f9f8;
    --border: #ececeb;
    --border-strong: #e2e2e0;
    --text: #26262a;
    --text-2: #6e6e74;
    --text-3: #a5a5ab;
    --hover: #f0f0ef;
    --active: #ebebea;
    --accent: #ee6d33;
    --accent-deep: #dd5722;
    --accent-soft: #fdf1e9;
    --accent-border: #f5dcc9;
    --ok: #1f7a33;      --ok-soft: #e9f3eb;
    --err: #c93a2b;     --err-soft: #fbecea;
    --warn: #9a6700;    --warn-soft: #fdf3df;
    --code-bg: #f6f6f5;
    --shadow-sm: 0 1px 2px rgba(30,28,25,.05);
    --shadow-md: 0 2px 12px rgba(30,28,25,.06);
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    font-size: 14px; color: var(--text);
    background: var(--bg);
    display: flex; overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #dcdcd9; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #c9c9c5; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ 左侧栏 ============ */
  #sidebar {
    width: 264px; flex: none; display: flex; flex-direction: column;
    background: var(--side-bg); border-right: 1px solid var(--border);
  }
  .side-logo {
    display: flex; align-items: center; gap: 9px;
    padding: 14px 16px 10px; font-weight: 700; font-size: 14.5px;
  }
  .side-logo .mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  .menu-item {
    display: flex; align-items: center; gap: 10px;
    width: calc(100% - 20px); margin: 1px 10px; padding: 0 10px;
    height: 34px; border: none; background: none; border-radius: var(--r-sm);
    font-size: 13px; color: #45454b; text-align: left; flex: none;
  }
  .menu-item:hover { background: var(--hover); }
  .menu-item svg { color: #80808a; flex: none; }
  .menu-item kbd {
    margin-left: auto; font-family: inherit; font-size: 11px; color: #b8b8be;
  }

  /* 分组 / 项目 分段切换 */
  #side-tabs-row {
    display: flex; align-items: center; gap: 6px;
    margin: 12px 14px 4px; flex: none;
  }
  .seg { flex: 1; display: flex; background: #f0f0ef; border-radius: var(--r-sm); padding: 2px; }
  .seg button {
    flex: 1; height: 26px; border: none; background: none; border-radius: 6px;
    font-size: 12.5px; color: #7c7c83;
  }
  .seg button.on {
    background: #fff; color: var(--text); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.07);
  }
  .seg-acts { display: flex; gap: 2px; }
  .icon-btn {
    width: 26px; height: 26px; border: none; background: none; border-radius: 6px;
    color: #8f8f96; display: inline-flex; align-items: center; justify-content: center;
    flex: none;
  }
  .icon-btn:hover { background: var(--hover); color: #45454b; }

  #search-box { display: none; margin: 6px 14px 2px; flex: none; }
  #search-box.open { display: block; }
  #search-input {
    width: 100%; height: 30px; border: 1px solid var(--border-strong);
    border-radius: var(--r-sm); padding: 0 10px; font-size: 12.5px;
    background: #fff; color: var(--text); font-family: inherit;
  }
  #search-input:focus { outline: none; border-color: var(--accent); }

  #side-scroll { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  .list-label {
    font-size: 11.5px; color: #9a9aa0; margin: 12px 18px 4px; flex: none;
  }
  .list-empty { font-size: 12.5px; color: #b8b8be; margin: 4px 18px; }

  .session-item {
    position: relative; display: flex; align-items: center; gap: 8px;
    width: calc(100% - 16px); margin: 1px 8px; padding: 0 8px; height: 34px;
    border-radius: var(--r-sm); cursor: pointer; transition: background .12s;
  }
  .session-item:hover { background: var(--hover); }
  .session-item.active { background: var(--active); }
  .session-item .s-ico { flex: none; color: #8f8f96; display: inline-flex; }
  .session-item .title {
    flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-item.unnamed .title { color: var(--text-3); font-style: italic; }
  .session-item .meta { flex: none; font-size: 11px; color: #b8b8be; }
  .session-item .s-del, .session-item .s-ren {
    display: none; flex: none;
    width: 20px; height: 20px; padding: 0;
    border: none; background: none; border-radius: 5px;
    color: #b8b8be; align-items: center; justify-content: center;
  }
  .session-item:hover .s-del, .session-item:hover .s-ren { display: inline-flex; }
  .session-item:hover .meta { display: none; }   /* 悬停时时间让位给操作钮 */
  .session-item .s-del:hover { color: var(--err); background: #e2e2e0; }
  .session-item .s-ren:hover { color: var(--accent-deep); background: #e2e2e0; }
  .session-item.renaming .title, .session-item.renaming .meta,
  .session-item.renaming .s-del, .session-item.renaming .s-ren { display: none; }
  /* 并行运行态: 运行中脉冲点 / 排队/未读红点 */
  .session-item .s-run {
    display: none; flex: none; width: 14px; height: 14px;
    align-items: center; justify-content: center;
  }
  .session-item.running .s-run { display: inline-flex; }
  .session-item.running .meta { display: none; }      /* 运行中让位给脉冲点 */
  .session-item.running .s-run::after {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: pulse 1.2s infinite;
  }
  .session-item .s-unread {
    display: none; flex: none; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 600; line-height: 16px; text-align: center;
  }
  .session-item.unread .s-unread { display: inline-block; }
  .session-item.unread .meta { display: none; }
  .session-item.running.unread .s-unread { display: none; }  /* 运行中优先显脉冲 */
  .inline-rename {
    flex: 1; min-width: 0; height: 24px;
    font-family: inherit; font-size: 12.5px; color: var(--text);
    background: #fff; border: 1px solid var(--accent); border-radius: 6px;
    padding: 0 7px;
  }
  .inline-rename:focus { outline: none; }

  /* 底栏: 连接状态 + 装饰入口 */
  .side-bottom {
    flex: none; border-top: 1px solid var(--border);
    padding: 8px 12px; display: flex; align-items: center; gap: 8px;
  }
  .side-bottom .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: #ececeb; color: #6e6e74;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #conn-state {
    display: inline-flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    font-size: 12px; color: var(--text-2);
  }
  #conn-state .dot { width: 7px; height: 7px; border-radius: 50%; background: #c9c9cd; flex: none; }
  #conn-state.on .dot { background: #3d9a4e; }
  #conn-state.err .dot { background: var(--err); }

  /* ============ 右侧主区 ============ */
  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }

  /* 文档标题栏 */
  #doc-header {
    flex: none; display: flex; align-items: center; gap: 10px;
    height: 54px; padding: 0 22px; border-bottom: 1px solid #f1f1ef;
  }
  #doc-title {
    font-size: 15px; font-weight: 600; color: var(--text);
    max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: text;
  }
  #doc-title:hover { color: var(--accent-deep); }
  .doc-title-input {
    width: 300px; max-width: 36vw;
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text);
    background: #fff; border: 1px solid var(--accent); border-radius: 6px;
    padding: 3px 8px;
  }
  .doc-title-input:focus { outline: none; }
  .ws-tag {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    background: #f4f4f3; border-radius: 6px; padding: 3px 9px;
    font-size: 12px; color: var(--text-2);
  }
  .ws-tag svg { color: #8f8f96; }
  #doc-header .spacer { flex: 1; }

  /* ============ 聊天区 ============ */
  #messages { flex: 1; overflow-y: auto; }
  #msg-col { max-width: 880px; margin: 0 auto; padding: 28px 32px 10px; }

  /* 空状态 */
  .empty-state { text-align: center; padding-top: 13vh; }
  .empty-state .mark {
    width: 44px; height: 44px; border-radius: 14px; margin: 0 auto 14px;
    background: var(--accent); color: #fff; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-md);
  }
  .empty-state h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .empty-state p { color: var(--text-2); font-size: 13px; margin-bottom: 22px; }
  .sug-chip {
    display: inline-block; margin: 0 5px 8px; padding: 8px 15px;
    border: 1px solid var(--border-strong); border-radius: 999px;
    background: #fff; color: var(--text-2); font-size: 13px;
    transition: all .15s;
  }
  .sug-chip:hover { border-color: var(--accent-border); color: var(--accent-deep); background: var(--accent-soft); }

  /* 用户消息: 右对齐气泡 */
  .msg { display: flex; margin-bottom: 20px; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 76%; padding: 10px 15px;
    background: var(--accent-soft); border: 1px solid var(--accent-border);
    border-radius: var(--r-lg); border-bottom-right-radius: 5px;
    font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }

  /* assistant 消息: 头像 + 无框正文（文档感） */
  .msg.assistant { gap: 11px; }
  .msg.assistant .avatar {
    flex: none; width: 26px; height: 26px; margin-top: 2px;
    border-radius: 8px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg.assistant .bubble {
    flex: 1; min-width: 0; font-size: 14px; line-height: 1.75; word-break: break-word;
  }

  /* assistant markdown */
  .bubble p { margin: 0 0 .65em; } .bubble p:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: .95em 0 .45em; line-height: 1.4; }
  .bubble h1 { font-size: 1.3em; } .bubble h2 { font-size: 1.18em; } .bubble h3 { font-size: 1.06em; }
  .bubble ul, .bubble ol { margin: .4em 0 .7em 1.5em; }
  .bubble li { margin: .2em 0; }
  .bubble code {
    font-family: Consolas, "JetBrains Mono", monospace; font-size: .9em;
    background: var(--code-bg); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 5px;
  }
  .bubble pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 11px 13px; overflow-x: auto; margin: .55em 0;
  }
  .bubble pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  .bubble a { color: var(--accent-deep); }
  .bubble table { border-collapse: collapse; margin: .6em 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border-strong); padding: 6px 11px; }
  .bubble th { background: var(--code-bg); font-weight: 600; }
  .bubble blockquote {
    border-left: 3px solid var(--border-strong); margin: .6em 0;
    padding: 2px 0 2px 12px; color: var(--text-2);
  }

  /* 工具调用行: 灰色一行式条目（参考图风格），纯展示 */
  .tool-row {
    display: flex; align-items: center; gap: 7px;
    margin: 2px 0 10px 37px; padding: 4px 9px;
    font-size: 13px; color: #a0a0a6;
  }
  .tool-row .t-ico { flex: none; display: inline-flex; }
  .tool-row .tname2 { flex: none; }
  .tool-row .tdesc {
    flex: 0 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: Consolas, monospace; font-size: 12px;
  }
  .tool-row .tstate { flex: none; }
  .tstate::before { content: "· "; }
  .tstate.run { animation: pulse 1.2s infinite; }
  .tstate.err { color: var(--err); }
  .tstate.denied { color: var(--warn); }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* 思考行: 实时「思考中…」→ 收口为「思考 · 持续了X秒」 */
  .think-row {
    display: flex; align-items: center; gap: 7px;
    margin: 2px 0 10px 37px; padding: 4px 9px;
    font-size: 13px; color: #a0a0a6;
  }
  .think-row .t-ico { flex: none; display: inline-flex; }
  .think-row .pulse-dots { display: inline-flex; gap: 3px; margin-left: 2px; }
  .think-row .pulse-dots i {
    width: 4px; height: 4px; border-radius: 50%; background: #b4b4ba;
    animation: pulse 1s infinite;
  }
  .think-row .pulse-dots i:nth-child(2) { animation-delay: .18s; }
  .think-row .pulse-dots i:nth-child(3) { animation-delay: .36s; }

  /* 提示条（警告/错误） */
  .note {
    max-width: fit-content; margin: 0 0 16px; padding: 7px 13px;
    border-radius: var(--r-sm); font-size: 13px;
  }
  .note.warn { color: var(--warn); background: var(--warn-soft); }
  .note.err  { color: var(--err); background: var(--err-soft); }

  /* ============ 底部输入卡片 ============ */
  #composer { flex: none; padding: 6px 32px 18px; }
  #thinking { display: none; max-width: 880px; margin: 0 auto 8px; padding-left: 4px; }
  #thinking .dots { display: inline-flex; gap: 4px; margin-right: 9px; }
  #thinking .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  #thinking .dots i:nth-child(2) { animation-delay: .15s; }
  #thinking .dots i:nth-child(3) { animation-delay: .3s; }
  #thinking .t { color: var(--text-3); font-size: 13px; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

  #input-card {
    max-width: 880px; margin: 0 auto;
    border: 1px solid var(--border-strong); border-radius: var(--r-lg);
    background: #fff; box-shadow: var(--shadow-md);
    padding: 13px 14px 10px 17px;
    transition: border-color .15s;
  }
  #input-card:focus-within { border-color: #f0a582; }
  #input {
    width: 100%; resize: none; border: none; background: none;
    color: var(--text); font-family: inherit; font-size: 14px;
    line-height: 1.55; max-height: 160px; padding: 2px 0 10px;
    display: block;
  }
  #input:focus { outline: none; }
  #input::placeholder { color: var(--text-3); }
  .comp-row { display: flex; align-items: center; gap: 6px; }
  .comp-row .spacer { flex: 1; }

  .round-btn {
    width: 28px; height: 28px; border: none; background: none; border-radius: 50%;
    color: #7a7a80; display: inline-flex; align-items: center; justify-content: center;
    flex: none;
  }
  .round-btn:hover { background: var(--hover); color: #45454b; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; height: 28px;
    padding: 0 5px; border-radius: 8px; flex: none;
  }
  .pill:hover { background: #f5f5f4; }
  .pill > svg { flex: none; }
  .pill select {
    appearance: none; -webkit-appearance: none;
    border: none; background: transparent; height: 100%;
    font-family: inherit; font-size: 12.5px; color: var(--text-2); cursor: pointer;
    padding: 0 17px 0 1px; max-width: 180px;
  }
  .pill select:focus { outline: none; }
  .pill select:disabled { cursor: default; opacity: 1; }
  .pill.mode { color: var(--accent); }
  .pill.mode > svg { margin-left: 3px; }
  .pill.mode select {
    color: var(--accent); font-weight: 600;
    background: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 9 6'%3E%3Cpath d='M1 1l3.5 3.5L8 1' stroke='%23ee6d33' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 2px center;
  }
  .pill.model select {
    background: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 9 6'%3E%3Cpath d='M1 1l3.5 3.5L8 1' stroke='%238f8f96' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 2px center;
  }
  .pill.effort .ring {
    width: 12px; height: 12px; border: 1.7px solid #b4b4ba; border-radius: 50%;
    flex: none; margin-left: 3px;
  }
  .pill.effort select {
    background: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 9 6'%3E%3Cpath d='M1 1l3.5 3.5L8 1' stroke='%238f8f96' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 2px center;
  }

  #btn-send {
    width: 30px; height: 30px; border: none; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    flex: none; margin-left: 3px; transition: background .15s;
  }
  #btn-send:hover { background: var(--accent-deep); }
  #btn-send:disabled { background: #f2bd9e; cursor: not-allowed; }
  #btn-stop {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid #efc0b8; background: #fff; color: var(--err);
    display: none; align-items: center; justify-content: center;
    flex: none; margin-left: 3px;
  }
  #btn-stop:hover { background: var(--err-soft); }

  /* 工作目录 chip（草稿态选择项目目录） */
  .wd-chip {
    display: none; align-items: center; gap: 5px; height: 28px;
    padding: 0 9px; border-radius: 8px; border: none; background: none;
    color: var(--text-2); font-size: 12.5px; flex: none; max-width: 200px;
  }
  .wd-chip:hover { background: #f5f5f4; }
  .wd-chip.show { display: inline-flex; }
  .wd-chip #wd-chip-text {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 目录选择弹层 */
  #dir-pop {
    display: none; position: fixed; z-index: 150;
    width: 340px; background: #fff;
    border: 1px solid var(--border-strong); border-radius: 12px;
    box-shadow: 0 8px 32px rgba(30,28,25,.16);
    padding: 12px; flex-direction: column; gap: 8px;
  }
  #dir-pop.open { display: flex; }
  .dir-title { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .dir-path-row { display: flex; align-items: center; gap: 5px; }
  #dir-path-input {
    flex: 1; min-width: 0; height: 28px;
    border: 1px solid var(--border-strong); border-radius: 7px;
    padding: 0 9px; font-size: 12px; font-family: Consolas, monospace;
    color: var(--text); background: #fff;
  }
  #dir-path-input:focus { outline: none; border-color: var(--accent); }
  #dir-list {
    max-height: 210px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 8px;
  }
  .dir-item {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 10px; font-size: 12.5px; color: var(--text);
    cursor: pointer;
  }
  .dir-item:hover { background: var(--hover); }
  .dir-item svg { color: #8f8f96; flex: none; }
  .dir-empty { padding: 12px 10px; font-size: 12px; color: var(--text-3); }
  .dir-err { font-size: 11.5px; color: var(--err); display: none; padding: 0 2px; }
  .dir-err.show { display: block; }
  .dir-actions { display: flex; justify-content: flex-end; }
  #dir-pick {
    padding: 6px 16px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600;
  }
  #dir-pick:hover { background: var(--accent-deep); }

  /* ============ 权限审批 ============ */
  #perm-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(30,28,25,.38); backdrop-filter: blur(2px);
    align-items: center; justify-content: center;
  }
  #perm-modal {

<script>
"use strict";
/* ============================================================
 * 状态
 * ============================================================ */
const $ = id => document.getElementById(id);
const state = {
  sessionId: null,          // 当前"可见"的会话 id（null = 草稿/无）
  sessions: [],             // 全量会话列表（loadSessions 填充）
  sideTab: "project",       // 侧栏列表模式: project | group
  draft: false,             // 草稿态: 已点"新建"但还没发首条消息（不建条目）
  draftWorkdir: null,       // 草稿态选择的工作目录（项目的意义）
  serverWorkspace: null,    // 服务进程工作区名（无会话目录时的兜底展示）
  runs: {},                 // sessionId → 运行态（多会话并行: 各自 WS/流式指针/审批）
};

/* 一个会话的运行态。多会话并行的核心: 每个会话有自己的 WebSocket、
   流式 DOM 指针、权限审批、未读数。切换会话只是换"可见"的 id,
   后台会话的 WS 与轮次照常跑; 回到前台时按需重拉历史对齐。 */
function runOf(id) {
  if (!state.runs[id]) {
    state.runs[id] = {
      ws: null,               // 该会话的 WebSocket
      busy: false,            // 一轮对话进行中（含排队等待槽位）
      queued: false,          // 在全局并发队列中等待槽位
      pendingPerm: null,      // 待审批的 permission_request
      activeToolCard: null,   // 当前流式中的工具行（配对 tool_result）
      curBubble: null,        // 当前流式中的正文气泡
      curThinking: null,      // 当前流式中的思考行 { el, t0 }
      toolResultIndex: {},    // 历史回放: tool_use id → 行（等结果块配对）
      currentWorkdir: null,   // 该会话的工作目录（messages 接口返回）
      pendingSends: [],       // WS 建立期间待发的消息（onopen 后冲刷）
      unread: 0,              // 后台完成/待审批的未读计数
      everHidden: false,      // 本轮有事件在后台到达过（回前台需重拉历史）
      loaded: false,          // 历史是否已加载过（首次切入必拉）
    };
  }
  return state.runs[id];
}
const curRun = () => (state.sessionId ? runOf(state.sessionId) : null);

/* ============================================================
 * markdown 渲染: marked.js 优先，加载失败降级为转义纯文本
 * ============================================================ */
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
function renderMd(text) {
  if (window.marked && window.marked.parse) {
    try {
      return window.marked.parse(text, { breaks: true, gfm: true });
    } catch (e) { /* 落到降级 */ }
  }
  return "<p>" + escapeHtml(text).replace(/\n/g, "<br>") + "</p>";
}

/* ============================================================
 * 轻提示
 * ============================================================ */
let toastTimer = null;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

/* ============================================================
 * 侧栏会话列表（项目 / 分组 两种模式 + 搜索过滤）
 * ============================================================ */
function sessionDate(id) {
  // 会话 id 是 %Y%m%d-%H%M%S 时间戳（可能有 "w" 后缀防撞）
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/.exec(id);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function relativeTime(id) {
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/.exec(id);
  if (!m) return "";
  const then = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
  const diff = (Date.now() - then.getTime()) / 1000;
  if (diff < 90) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + "分钟";
  if (diff < 86400) return Math.floor(diff / 3600) + "小时";
  if (diff < 172800) return "1天";
  if (diff < 604800) return Math.floor(diff / 86400) + "天";
  return `${+m[2]}/${+m[3]}`;
}
function sessionBucket(id) {
  const d = sessionDate(id);
  if (!d) return 3;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.floor((today - d) / 86400000);
  if (days <= 0) return 0;      // 今天
  if (days === 1) return 1;     // 昨天
  if (days < 7) return 2;       // 7 天内
  return 3;                     // 更早
}
const BUCKET_LABELS = ["今天", "昨天", "7 天内", "更早"];
const FOLDER_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>';
const UNTITLED_TITLE = "未命名任务";

function displayTitle(s) {
  return (!s || s.title === "(未命名)") ? UNTITLED_TITLE : s.title;
}

async function loadSessions() {
  try {
    const r = await fetch("/api/sessions");
    const data = await r.json();
    state.sessions = data.sessions;
    renderSessionList();
  } catch (e) { console.error("加载会话列表失败", e); }
}

const TRASH_SMALL_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13"/></svg>';
const PENCIL_SMALL_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.5-1L20 7.5 16.5 4 5 15.5 4 20z"/></svg>';

async function renameSession(id, title) {
  try {
    const r = await fetch(`/api/sessions/${id}/rename`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || r.status);
    }
    const s = state.sessions.find(x => x.id === id);
    if (s) s.title = title;
    renderSessionList();
    if (id === state.sessionId) refreshDocTitle();
  } catch (e) {
    toast("重命名失败: " + e.message);
  }
}

/* 通用行内编辑框: Enter/失焦提交，Esc 取消；onDone 无论提交与否都会回调 */
function makeInlineEditor(initial, onCommit, onDone) {
  const input = document.createElement("input");
  input.className = "inline-rename";
  input.maxLength = 60;
  input.value = initial;
  const finish = commit => {
    if (input._done) return;
    input._done = true;
    const val = input.value.trim();
    input.remove();
    if (commit && val && val !== initial) onCommit(val);
    if (onDone) onDone(commit);
  };
  input.onclick = ev => ev.stopPropagation();
  input.onkeydown = ev => {
    ev.stopPropagation();   // 别让按键冒泡成全局快捷键
    if (ev.key === "Enter") finish(true);
    else if (ev.key === "Escape") finish(false);
  };
  input.onblur = () => finish(true);
  requestAnimationFrame(() => { input.focus(); input.select(); });
  return input;
}

function makeSessionItem(s) {
  const item = document.createElement("div");
  const unnamed = s.title === "(未命名)";
  item.className = "session-item"
    + (s.id === state.sessionId ? " active" : "")
    + (unnamed ? " unnamed" : "");
  item.dataset.id = s.id;
  item.title = `${s.title} · ${s.message_count} 条消息`;
  item.innerHTML = '<span class="s-ico">' + FOLDER_SVG + '</span>'
    + '<span class="s-run" title="运行中"></span><span class="s-unread"></span>'
    + '<span class="title"></span><span class="meta"></span>'
    + '<button class="s-ren" title="重命名">' + PENCIL_SMALL_SVG + '</button>'
    + '<button class="s-del" title="删除会话">' + TRASH_SMALL_SVG + '</button>';
  item.querySelector(".title").textContent = displayTitle(s);
  item.querySelector(".meta").textContent = relativeTime(s.id);
  const run = state.runs[s.id];
  if (run && run.busy) item.classList.add("running");
  if (run && run.unread > 0) {
    item.classList.add("unread");
    item.querySelector(".s-unread").textContent = run.unread > 99 ? "99+" : run.unread;
  }
  item.onclick = () => selectSession(s.id);
  item.querySelector(".s-ren").onclick = ev => {
    ev.stopPropagation();
    if (item.classList.contains("renaming")) return;
    item.classList.add("renaming");   // 编辑期间隐藏标题/时间/按钮
    const input = makeInlineEditor(
      displayTitle(s),
      val => renameSession(s.id, val),
      () => item.classList.remove("renaming"),
    );
    item.appendChild(input);
  };
  item.querySelector(".s-del").onclick = ev => {
    ev.stopPropagation();
    deleteSession(s.id);
  };
  return item;
}

async function deleteSession(id) {
  const run = state.runs[id];
  if (run && run.busy) {
    toast("该会话本轮对话进行中，暂不能删除");
    return;
  }
  const cur = state.sessions.find(s => s.id === id);
  if (!confirm(`删除会话「${displayTitle(cur)}」？删除后不可恢复。`)) return;
  try {
    const r = await fetch(`/api/sessions/${id}`, { method: "DELETE" });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || r.status);
    }
    state.sessions = state.sessions.filter(s => s.id !== id);
    closeWs(id);                 // 断掉该会话的 WS
    delete state.runs[id];       // 运行态一并清理
    renderSessionList();
    if (id === state.sessionId) {
      // 删的是当前会话: 自动切到最近的会话，没有则回草稿态
      state.sessionId = null;
      const next = state.sessions[0];
      if (next) await selectSession(next.id);
      else startDraft();
    }
    toast("会话已删除");
  } catch (e) {
    toast("删除失败: " + e.message);
  }
}

function renderSessionList() {
  const list = $("session-list");
  list.innerHTML = "";
  const q = ($("search-input").value || "").trim().toLowerCase();
  const sessions = state.sessions.filter(
    s => !q
      || (s.title || "").toLowerCase().includes(q)
      || (s.workdir || "").toLowerCase().includes(q));   // 项目路径/目录名也可搜
  if (!sessions.length) {
    list.innerHTML = '<div class="list-empty">' + (q ? "没有匹配的会话" : "还没有会话") + "</div>";
    return;
  }
  const addLabel = text => {
    const l = document.createElement("div");
    l.className = "list-label";
    l.textContent = text;
    list.appendChild(l);
  };
  if (state.sideTab === "group") {
    // 会话按时间倒序，分组标签自然按 今天→更早 顺序出现
    let bucket = -1;
    for (const s of sessions) {
      const b = sessionBucket(s.id);
      if (b !== bucket) { bucket = b; addLabel(BUCKET_LABELS[b]); }
      list.appendChild(makeSessionItem(s));
    }
  } else {
    // 按项目(工作目录)分组: 组标题是目录名, 悬停看完整路径;
    // 没设置工作目录的会话归入「未设置项目」, 永远排在最后。
    const groups = new Map();   // workdir → sessions(时间倒序, 列表本身已倒序)
    for (const s of sessions) {
      const key = s.workdir || "";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    const named = [...groups.entries()].filter(([k]) => k);
    named.sort((a, b) => b[1][0].id.localeCompare(a[1][0].id));  // 组间按最新会话
    for (const [wd, items] of named) {
      const label = document.createElement("div");
      label.className = "list-label";
      label.textContent = projectDisplayName(wd);
      label.title = wd;          // 悬停显示完整路径
      label.style.maxWidth = "calc(100% - 36px)";
      label.style.overflow = "hidden";
      label.style.textOverflow = "ellipsis";
      label.style.whiteSpace = "nowrap";
      list.appendChild(label);
      for (const s of items) list.appendChild(makeSessionItem(s));
    }
    const loose = groups.get("") || [];
    if (loose.length) {
      addLabel("未设置项目");
      for (const s of loose) list.appendChild(makeSessionItem(s));
    }
  }
}

/* 项目分组的组标题: 与顶栏 ws-tag 一致取目录名(末段), 空路径兜底 */
function projectDisplayName(wd) {

}

function markActiveSession() {
  document.querySelectorAll(".session-item").forEach(el => {

function refreshDocTitle() {

/* ============================================================
 * 工作目录（项目）: 草稿态选择 + 顶栏标签展示

function dirName(p) { return p ? p.split(/[\\/]/).filter(Boolean).pop() : null; }

function refreshWorkdirTag() {

function updateWdChipVisibility() {

const dirPop = $("dir-pop");
let dirBrowsePath = null;

async function browseDir(path) {
  const err = $("dir-err");
  err.classList.remove("show");
  try {
    const q = path ? "?path=" + encodeURIComponent(path) : "";
    const r = await fetch("/api/dirs" + q);
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail || r.status);
    }
    const data = await r.json();
    dirBrowsePath = data.path;
    $("dir-path-input").value = data.path;
    const list = $("dir-list");
    list.innerHTML = "";
    if (!data.dirs.length) {
      list.innerHTML = '<div class="dir-empty">此目录下没有子目录</div>';
      return;
    }
    for (const name of data.dirs) {
      const it = document.createElement("div");
      it.className = "dir-item";
      it.innerHTML = FOLDER_SVG + '<span></span>';
      it.querySelector("span").textContent = name;
      it.onclick = () => browseDir(dirBrowsePath.replace(/[\\/]+$/, "") + "\\" + name);
      list.appendChild(it);
    }
  } catch (e) {
    err.textContent = "无法读取: " + e.message;
    err.classList.add("show");
  }
}

function openDirPop() {
  const r = $("wd-chip").getBoundingClientRect();
  dirPop.classList.add("open");
  const left = Math.max(10, Math.min(r.left, window.innerWidth - 352));
  dirPop.style.left = left + "px";
  dirPop.style.top = "auto";
  dirPop.style.bottom = (window.innerHeight - r.top + 8) + "px";
  browseDir(state.draftWorkdir || "");
}
function closeDirPop() { dirPop.classList.remove("open"); }

$("wd-chip").onclick = ev => {
  ev.stopPropagation();

  dirPop.classList.contains("open") ? closeDirPop() : openDirPop();
};
$("dir-up").onclick = () => {
  const parts = (dirBrowsePath || "").split(/[\\/]/).filter(Boolean);
  if (!parts.length) return;
  parts.pop();
  if (!parts.length) return;
  // 只剩盘符（如 "D:"）时补上根斜杠，避免 Path("D:") 落到盘符当前目录
  browseDir(parts.length === 1 && /^[a-zA-Z]:$/.test(parts[0]) ? parts[0] + "\\" : parts.join("\\"));
};
function goDirInput() { browseDir($("dir-path-input").value.trim()); }
$("dir-go").onclick = goDirInput;
$("dir-path-input").addEventListener("keydown", ev => {

$("dir-pick").onclick = () => {

document.addEventListener("click", ev => {

/* 顶栏标题点击重命名（Notion 式） */
$("doc-title").title = "点击重命名";
$("doc-title").onclick = () => {

  if ($("doc-title").querySelector("input")) return;

  if (!cur) return;

    displayTitle(cur),

/* ============================================================
 * 会话切换 / 新建 / 历史回放
 * ============================================================ */
async function selectSession(id) {
  state.draft = false;
  const prevId = state.sessionId;
  state.sessionId = id;
  const run = runOf(id);
  markActiveSession();
  refreshDocTitle();
  renderSessionList();          // 未读标识切换
  // 连接该会话的 WS（已有连接则复用）; 旧会话的 WS 原样保留, 后台继续跑
  connectWs(id);
  // 本轮事件曾在后台到达过: 流式 DOM 不可靠, 重拉历史对齐
  if (run.everHidden || !run.loaded) {
    $("messages").innerHTML = '<div id="msg-col"><div class="empty-state"><h2>加载中…</h2></div></div>';
    run.toolResultIndex = {};
    try {
      const r = await fetch(`/api/sessions/${id}/messages`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      run.currentWorkdir = data.workdir || null;
      run.loaded = true;
      run.everHidden = false;
      run.unread = 0;           // 回到前台看完了, 未读清零
      renderSessionList();
      if (id === state.sessionId) {   // 等待期间用户可能又切走
        refreshWorkdirTag();
        $("messages").innerHTML = "";
        if (!data.messages.length) {
          showEmptyState();
        } else {
          $("messages").innerHTML = "<div id='msg-col'></div>";
          for (const m of data.messages) renderHistoryMessage(m);
        }
        scrollToBottom();
        // 有挂着的审批请求: 重新弹出
        if (run.pendingPerm) onPermissionRequest(run.pendingPerm);
      }
    } catch (e) {
      $("messages").innerHTML = "<div id='msg-col'></div>";
      addErrorBubble("加载历史失败: " + e.message);
    }
  }
  setBusyUi(run.busy);
  setSendEnabled(!run.busy);
  setConn(run.ws && run.ws.readyState === 1 ? "on" : "", run.ws ? (run.ws.readyState === 1 ? "已连接" : "连接中…") : "未连接");
}

const SUGGESTIONS = [
  "帮我看看这个项目的整体结构",
  "解释一下 runtime.py 的主循环",
  "跑一下全部测试并总结结果",
];

function showEmptyState() {
  $("messages").innerHTML =
    "<div id='msg-col'><div class='empty-state'>" +
    "<div class='mark'>✻</div><h2>开始新任务</h2>" +
    "<p>和 x-code 聊聊代码，它会用工具帮你完成任务</p>" +
    SUGGESTIONS.map(s => `<button class='sug-chip'>${escapeHtml(s)}</button>`).join("") +
    "</div></div>";
  document.querySelectorAll(".sug-chip").forEach(chip => {
    chip.onclick = () => {
      $("input").value = chip.textContent;
      autoGrow($("input"));

function startDraft() {
  /* "新建任务"只进入草稿态，不向服务端要 id——首条消息发出时才真正建会话，
     避免侧栏堆一批没有内容的"未命名任务"条目。
     其他会话在跑也允许新建——多会话并行是本来的意义。 */
  state.draft = true;
  state.sessionId = null;
  markActiveSession();
  refreshDocTitle();
  updateWdChipVisibility();
  setDraftWorkdir(state.draftWorkdir);   // 保留上次选择，方便连建同项目会话
  showEmptyState();
  setBusyUi(false);
  setSendEnabled(true);
  setConn("", "未连接");
  $("input").focus();
}

/* 历史消息回放: role + blocks（text / tool_use / tool_result） */
function renderHistoryMessage(m) {
  if (m.role === "user") {
    const text = m.blocks.filter(b => b.type === "text").map(b => b.text).join("\n");
    if (text) addUserBubble(text);
    return;
  }
  if (m.role === "assistant") {
    // text 与 tool_use 交替出现: text → 气泡, tool_use → 卡片（登记待配对）
    let buf = [];
    const flush = () => {
      if (buf.length) { addAssistantBubble(buf.join("")); buf = []; }
    };
    for (const b of m.blocks) {
      if (b.type === "text") {
        buf.push(renderMd(b.text));
      } else if (b.type === "tool_use") {
        flush();
        const card = addToolCard({ id: b.id, name: b.name, input: b.input });
        curRun().toolResultIndex[b.id] = card;   // 等 tool 角色的结果块配对
      }
    }
    flush();
    return;
  }
  if (m.role === "tool") {
    for (const b of m.blocks) {
      if (b.type !== "tool_result") continue;
      const card = curRun().toolResultIndex[b.id];
      if (card) {
        completeToolCard(card, { output: b.output, is_error: b.is_error, denied: false });
      } else {
        // 配不上对（旧数据/截断）: 独立卡片兜底
        addToolCard({ id: b.id, name: b.name, input: "(—)",
                      result: { output: b.output, is_error: b.is_error, denied: false } });
      }
    }
  }
}

/* ============================================================
 * WebSocket
 * ============================================================ */
function setConn(cls, text) {
  $("conn-state").className = cls;
  $("conn-text").textContent = text;
}

function connectWs(id) {
  if (!id) return;
  const run = runOf(id);
  // 已连接或连接中就不动——切换会话不再断开后台会话的 WS
  if (run.ws && (run.ws.readyState === 0 || run.ws.readyState === 1)) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/${id}`);
  run.ws = ws;

  ws.onopen = () => {
    if (id === state.sessionId) setConn("on", "已连接");
    // 首条消息在 WS 建立期间入队，连接好了统一发出
    const pending = run.pendingSends;
    run.pendingSends = [];
    for (const p of pending) ws.send(JSON.stringify(p));
  };
  ws.onclose = () => {
    if (id === state.sessionId) setConn("", "已断开");
    if (run.ws === ws) run.ws = null;
  };
  ws.onerror = () => { if (id === state.sessionId) setConn("err", "连接错误"); };
  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleServerMessage(msg, id);
  };
}

function closeWs(id) {
  const run = id ? state.runs[id] : null;
  if (run && run.ws) {
    const ws = run.ws;
    run.ws = null;
    ws.onclose = null;   // 防止触发断连提示
    ws.close();
  }
}

/* ============================================================
 * 服务端消息分派
 * ============================================================ */
function handleServerMessage(msg, sid) {
  // 后台会话的事件: 不渲染（主区属于当前可见会话）, 只累计未读。
  // 后台轮次的流式 DOM 无法可靠拼装, 标记 everHidden, 回前台重拉历史对齐。
  if (sid !== state.sessionId) {
    const run = runOf(sid);
    run.everHidden = true;
    if (msg.type === "permission_request") bumpUnread(sid);
    else if (msg.type === "tool_result") bumpUnread(sid);
    else if (msg.type === "turn_done" || msg.type === "error") bumpUnread(sid);
    if (msg.type === "permission_request") {
      run.pendingPerm = msg;           // 记下待审批, 点回去即见弹窗
    } else if (msg.type === "turn_done" || msg.type === "error") {
      run.busy = false;
      run.queued = false;
      run.pendingPerm = null;
    }
    return;
  }
  switch (msg.type) {
    case "text_delta":         onTextDelta(msg); break;
    case "tool_use":           onToolUse(msg); break;
    case "tool_result":        onToolResult(msg); break;
    case "thinking_start":     onThinkingStart(msg); break;
    case "thinking_end":       onThinkingEnd(msg); break;
    case "turn_queued":        onTurnQueued(msg); break;
    case "permission_request": onPermissionRequest(msg); break;
    case "turn_done":          onTurnDone(msg); break;
    case "session_renamed":    onSessionRenamed(msg); break;
    case "error":              onError(msg); break;
    default: console.warn("未知消息类型", msg);
  }
}

function bumpUnread(sid) {
  const run = runOf(sid);
  run.unread += 1;
  const s = state.sessions.find(x => x.id === sid);
  if (s) s._unreadShown = run.unread;
  renderSessionList();
}

/* ---------- 正文流式 ---------- */
function onTextDelta(msg) {
  const run = curRun();
  $("thinking").style.display = "none";
  if (!run.curBubble) {
    run.curBubble = addAssistantBubble("");
    run.curBubble._raw = "";
  }
  run.curBubble._raw += msg.text;
  run.curBubble.innerHTML = renderMd(run.curBubble._raw);
  scrollToBottom();
}

/* 流式气泡收口: 有内容就固化，下一轮正文开新气泡 */
function flushAssistantBubble() {
  const run = curRun();
  if (!run) return;
  if (run.curBubble && !run.curBubble._raw) {
    run.curBubble.closest(".msg").remove();   // 空气泡（模型直接调工具）: 移除
  }
  run.curBubble = null;
}

/* ---------- 思考行 ---------- */
const ICON_MIND = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.8.7 1.4 1.5 1.6 2.5h4.8c.2-1 .8-1.8 1.6-2.5A6 6 0 0012 3z"/></svg>';
const ICON_TERM = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9l3.5 3L7 15M12.5 15H17"/></svg>';
const ICON_FILE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6V3z"/><path d="M14 3v4h4"/></svg>';
const ICON_EDIT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.5-1L20 7.5 16.5 4 5 15.5 4 20z"/></svg>';

const TOOL_META = {
  bash:       { label: "终端",     icon: ICON_TERM },
  powershell: { label: "终端",     icon: ICON_TERM },
  read_file:  { label: "读取文件", icon: ICON_FILE },
  write_file: { label: "写入文件", icon: ICON_EDIT },
};

function fmtDuration(ms) {
  const s = ms / 1000;
  if (s < 1) return "不到 1 秒";
  if (s < 60) return Math.round(s) + " 秒";
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return r ? `${m} 分 ${r} 秒` : `${m} 分钟`;
}

function onThinkingStart() {
  const run = curRun();
  $("thinking").style.display = "none";
  flushAssistantBubble();
  if (run.curThinking) return;   // 已有实时思考行
  const div = document.createElement("div");
  div.className = "think-row";
  div.innerHTML = '<span class="t-ico">' + ICON_MIND + '</span><span>思考中</span>' +
    '<span class="pulse-dots"><i></i><i></i><i></i></span>';
  msgCol().appendChild(div);
  run.curThinking = { el: div, t0: Date.now() };
  scrollToBottom();
}

function onThinkingEnd(msg) {
  const run = curRun();
  $("thinking").style.display = "none";
  const cur = run.curThinking;
  if (!cur) return;
  // 服务端计时优先，缺失（轮次兜底收口）时用客户端起止时间
  const ms = typeof msg.duration_ms === "number" ? msg.duration_ms : Date.now() - cur.t0;
  cur.el.innerHTML = '<span class="t-ico">' + ICON_MIND + '</span>' +
    '<span>思考 · 持续了 ' + fmtDuration(ms) + '</span>';
  run.curThinking = null;
  scrollToBottom();
}

/* ---------- 工具调用 ---------- */
function describeInput(raw) {
  // 卡片标题一行摘要: JSON 先取 command/path 等关键字段，失败展示原文
  try {
    const data = JSON.parse(raw);
    if (data && typeof data === "object") {
      for (const k of ["command", "path", "file_path", "url", "content"]) {
        if (typeof data[k] === "string" && data[k].trim()) {
          return data[k].replace(/\s+/g, " ").slice(0, 90);
        }
      }
      return Object.keys(data)
        .map(k => `${k}=${String(data[k])}`).join(" ").slice(0, 90);
    }
  } catch (e) { /* not json */ }
  return String(raw || "").replace(/\s+/g, " ").slice(0, 90);
}

function addToolCard({ id, name, input, result }) {
  const meta = TOOL_META[name] || { label: name, icon: ICON_TOOL };
  const row = document.createElement("div");
  row.className = "tool-row";
  row.innerHTML =
    '<span class="t-ico">' + meta.icon + '</span>' +
    '<span class="tname2"></span><span class="tdesc"></span><span class="tstate"></span>';
  row.querySelector(".tname2").textContent = meta.label;
  row.querySelector(".tdesc").textContent = describeInput(input);
  if (result) {
    completeToolCard(row, result);
  } else {
    setToolState(row, "run");
  }
  msgCol().appendChild(row);
  scrollToBottom();
  return row;
}

function setToolState(row, kind) {
  const st = row.querySelector(".tstate");
  st.className = "tstate " + kind;
  st.textContent = { run: "运行中", ok: "已完成", err: "出错", denied: "已拒绝" }[kind];
}

function completeToolCard(row, { is_error, denied }) {
  if (denied) {
    setToolState(row, "denied");
  } else if (is_error) {
    setToolState(row, "err");
  } else {
    setToolState(row, "ok");
  }
}

function onToolUse(msg) {
  const run = curRun();
  $("thinking").style.display = "none";
  flushAssistantBubble();   // 工具前先收掉流式中的正文气泡
  run.activeToolCard = addToolCard({ id: msg.id, name: msg.name, input: msg.input });
}

function onToolResult(msg) {
  const run = curRun();
  flushAssistantBubble();
  // 优先配对流式卡片；配不上（历史遗留）就新开卡片兜底
  const card = run.activeToolCard;
  if (card) {
    completeToolCard(card, msg);
  } else {
    const fallback = addToolCard({ id: msg.id, name: msg.name, input: msg.input });
    completeToolCard(fallback, msg);
  }
  run.activeToolCard = null;
}

/* ---------- 权限审批 ---------- */
function onPermissionRequest(msg) {
  const run = curRun();
  run.pendingPerm = msg;
  const s = state.sessions.find(x => x.id === state.sessionId);
  $("perm-title").textContent =
    "需要授权" + (s ? ` — ${displayTitle(s)}` : "");
  $("perm-tool").textContent = msg.tool_name;
  $("perm-mode").textContent = `${msg.required_mode}（当前 ${msg.current_mode}）`;
  $("perm-input").textContent = msg.input;
  $("perm-overlay").style.display = "flex";
  $("btn-allow").focus();
}

function respondPermission(approved) {
  const run = curRun();
  if (!run || !run.pendingPerm) return;
  sendWs({
    type: "permission_response",
    request_id: run.pendingPerm.request_id,
    approved,
  });
  run.pendingPerm = null;
  $("perm-overlay").style.display = "none";
}

$("btn-allow").onclick = () => respondPermission(true);
$("btn-deny").onclick = () => respondPermission(false);

/* ---------- 轮次结束 / 错误 ---------- */
function endTurnUiReset() {
  const run = curRun();
  if (run) {
    run.busy = false;
    run.queued = false;
    run.unread = 0;             // 前台亲眼看完了, 未读清零
    flushAssistantBubble();
    run.activeToolCard = null;
    if (run.curThinking) onThinkingEnd({});   // 思考行兜底收口（客户端计时）
  }
  $("thinking").style.display = "none";
  setBusyUi(false);
  setSendEnabled(true);
  renderSessionList();          // 运行标识/未读刷新
}

function onTurnQueued(msg) {
  addNoteBubble("warn", `并发已满（上限 ${msg.max_concurrent} 轮），本轮已排队，前面轮次结束后自动开始`);
}

function onTurnDone(msg) {
  endTurnUiReset();
  if (msg.interrupted) {
    addNoteBubble("warn", "已中断本轮对话");
  } else if (msg.budget_exhausted) {
    addNoteBubble("warn", "本轮输出 token 预算已用尽，已提前收束本轮");
  } else if (msg.iterations_exhausted) {
    addNoteBubble("warn", `已达单轮最大迭代次数（${msg.iterations} 次调用），已提前收束本轮`);
  }
  // 刷新侧栏标题/消息数，标题可能被自动命名更新
  (async () => { await loadSessions(); refreshDocTitle(); })();
}

function onSessionRenamed(msg) {
  // AI 命名完成（在 turn_done 之后异步到达）: 刷新列表 + 顶栏标题
  (async () => { await loadSessions(); refreshDocTitle(); })();
}

function onError(msg) {
  // 错误也是本轮结束: 不复位 busy 的话输入框会永久锁死，看起来像卡死
  endTurnUiReset();
  addNoteBubble("err", msg.message || "未知错误");
}

function addNoteBubble(kind, text) {
  const div = document.createElement("div");
  div.className = "note " + kind;
  div.textContent = (kind === "err" ? "✗ " : "⚠ ") + text;
  msgCol().appendChild(div);
  scrollToBottom();
}

/* ============================================================
 * 气泡工厂
 * ============================================================ */
function msgCol() { return $("msg-col"); }

function addUserBubble(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;   // 用户输入永远纯文本
  div.appendChild(b);
  msgCol().appendChild(div);
  scrollToBottom();
  return b;
}

function addAssistantBubble(html) {
  const div = document.createElement("div");
  div.className = "msg assistant";
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "✻";
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = html || "";
  div.appendChild(avatar);
  div.appendChild(b);
  msgCol().appendChild(div);
  scrollToBottom();
  return b;
}

function scrollToBottom() {
  const el = $("messages");
  el.scrollTop = el.scrollHeight;
}

/* ============================================================
 * 发送 / 停止 / 输入框
 * ============================================================ */
function setSendEnabled(on) {
  $("btn-send").disabled = !on;
  $("input").disabled = !on;
}
function setBusyUi(busy) {
  // 忙碌（含排队）时发送圆钮切换为停止圆钮
  $("btn-send").style.display = busy ? "none" : "inline-flex";
  $("btn-stop").style.display = busy ? "inline-flex" : "none";
}

async function sendCurrent() {
  const input = $("input");
  const text = input.value.trim();
  const run = curRun();
  if (!text || (run && run.busy)) return;
  if (!state.draft && (!run || !run.ws || run.ws.readyState !== 1)) return;
  // 草稿态: 此刻才向服务端要 id 建会话条目；失败则留在草稿态
  let firstWorkdir = null;
  if (state.draft) {
    firstWorkdir = state.draftWorkdir;
    try {
      const r = await fetch("/api/sessions", { method: "POST" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      state.sessionId = (await r.json()).id;
    } catch (e) {
      toast("创建会话失败: " + e.message);
      return;
    }
  }
  // 空状态引导只出现一次: 发第一条消息前清掉（节点要保留，后续气泡都挂在这）
  const empty = document.querySelector(".empty-state");
  if (empty) empty.closest("#msg-col").innerHTML = "";
  addUserBubble(text);
  input.value = "";
  autoGrow(input);
  const myRun = runOf(state.sessionId);
  myRun.busy = true;
  $("thinking").style.display = "";
  setBusyUi(true);
  setSendEnabled(false);
  if (state.draft) {
    state.draft = false;
    myRun.currentWorkdir = state.draftWorkdir;
    // 列表此刻才出现新条目并选中；WS 建立期间消息会排队，onopen 后冲刷
    await loadSessions();
    // workdir 在首条消息落盘时才写入 JSONL, 此刻接口还查不到;
    // 先补进本地条目, 项目分组立即正确(下次 loadSessions 会以接口为准)
    const mine = state.sessions.find(s => s.id === state.sessionId);
    if (mine && state.draftWorkdir) mine.workdir = state.draftWorkdir;
    renderSessionList();
    markActiveSession();
    refreshDocTitle();
    updateWdChipVisibility();
    connectWs(state.sessionId);
  }
  sendWs({ type: "user", text, workdir: firstWorkdir || "" });
}

function sendWs(obj) {
  const run = curRun();
  if (!run) return;
  if (run.ws && run.ws.readyState === 1) {
    run.ws.send(JSON.stringify(obj));
  } else if (run.ws && run.ws.readyState === 0) {
    run.pendingSends.push(obj);   // 连接建立中: onopen 后冲刷
  }
}

$("btn-send").onclick = sendCurrent;
$("btn-stop").onclick = () => sendWs({ type: "stop" });
$("btn-new").onclick = startDraft;

$("input").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey) {
    ev.preventDefault();
    sendCurrent();
  }
});
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}
$("input").addEventListener("input", () => autoGrow($("input")));

/* ============================================================
 * 侧栏交互: 分组/项目切换 + 搜索 + 快捷键
 * ============================================================ */
function setSideTab(tab) {
  state.sideTab = tab;
  $("tab-project").classList.toggle("on", tab === "project");
  $("tab-group").classList.toggle("on", tab === "group");
  renderSessionList();
}
$("tab-project").onclick = () => setSideTab("project");
$("tab-group").onclick = () => setSideTab("group");

function openSearch() {
  $("search-box").classList.add("open");
  $("search-input").focus();
}
function closeSearch() {
  $("search-box").classList.remove("open");
  $("search-input").value = "";
  renderSessionList();
}
$("btn-search").onclick = openSearch;
$("btn-filter").onclick = () => {
  if ($("search-box").classList.contains("open")) closeSearch();
  else openSearch();
};
$("search-input").addEventListener("input", renderSessionList);
$("search-input").addEventListener("keydown", ev => {
  if (ev.key === "Escape") closeSearch();
});

document.addEventListener("keydown", ev => {
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === "n") {
    ev.preventDefault();
    startDraft();
  } else if (mod && ev.key.toLowerCase() === "k") {
    ev.preventDefault();
    openSearch();
  }
});

/* 装饰入口统一提示 */
document.querySelectorAll("[data-stub]").forEach(b => {
  b.onclick = () => toast("敬请期待");
});

/* ============================================================
 * 设置（输入卡片内的下拉）
 * ============================================================ */
function prettyModel(name) {
  // glm-5.3-flash → GLM 5.3 Flash（首段全大写，其余词首字母大写）
  if (!name) return "模型";
  return name.split("-").map((w, i) => {
    if (/^\d/.test(w)) return w;
    return i === 0 ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1);
  }).join(" ");
}

async function loadSettings() {
  try {
    const r = await fetch("/api/settings");
    const s = await r.json();
    $("sel-thinking").value = s.thinking_level;
    $("sel-mode").value = s.permission_mode;
    if (s.model) {
      const sel = $("sel-model");
      sel.disabled = false;
      sel.innerHTML = "";
      const opt = document.createElement("option");
      opt.value = s.model;
      opt.textContent = prettyModel(s.model);
      sel.appendChild(opt);
      sel.title = s.model;
      document.querySelector(".pill.model").title = "当前模型: " + s.model;
    }
    if (s.workspace) $("ws-tag-text").textContent = s.workspace;
    state.serverWorkspace = s.workspace || null;
    refreshWorkdirTag();
  } catch (e) { console.error("加载设置失败", e); }
}

async function saveSettings(patch) {
  try {
    const r = await fetch("/api/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      toast("设置失败: " + (err.detail || r.status));
      await loadSettings();   // 回显真实值
      return;
    }
    const s = await r.json();
    $("sel-thinking").value = s.thinking_level;
    $("sel-mode").value = s.permission_mode;
  } catch (e) { toast("设置失败: " + e.message); }
}
$("sel-thinking").onchange = () => saveSettings({ thinking_level: $("sel-thinking").value });
$("sel-mode").onchange = () => saveSettings({ permission_mode: $("sel-mode").value });

/* ============================================================
 * 启动
 * ============================================================ */
(async function init() {
  await loadSettings();
  await loadSessions();
  // 默认选最近的会话（列表已倒序，第一个即最新）
  const first = state.sessions[0];
  if (first) await selectSession(first.id);
  $("input").focus();
})();
</script>
