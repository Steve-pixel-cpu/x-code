<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>x-code</title>
<script>/* 主题在绘制前应用，避免闪白 */ document.documentElement.dataset.theme = localStorage.getItem("xc-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<style>
  /* ============ 设计令牌: 深色为默认，浅色经 [data-theme=light] 覆盖 ============ */
  :root {
    color-scheme: dark;
    --bg: #101014;
    --bg-side: #0b0b0f;
    --surface: #17171d;
    --surface-2: #1d1d24;
    --surface-3: #26262f;
    --border: #26262e;
    --border-strong: #34343e;
    --text: #ececf1;
    --text-2: #a0a1ab;
    --text-3: #6c6d78;
    --hover: #1d1d24;
    --active: #23232c;
    --accent: #f97316;
    --accent-deep: #ea6f0e;
    --accent-soft: rgba(249, 115, 22, .13);
    --accent-border: rgba(249, 115, 22, .38);
    --ok: #4ade80;      --ok-soft: rgba(74, 222, 128, .12);
    --err: #f87171;     --err-soft: rgba(248, 113, 113, .12);
    --warn: #fbbf24;    --warn-soft: rgba(251, 191, 36, .12);
    --code-bg: #0c0c11;
    --code-head: #131318;
    --overlay: rgba(6, 6, 10, .6);
    --shadow-md: 0 2px 12px rgba(0, 0, 0, .28);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, .42);
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
    /* 代码高亮（hljs 类名，深色） */
    --hl-comment: #6b6d76; --hl-keyword: #f27a5c; --hl-string: #9ecb74;
    --hl-number: #e5b567;  --hl-title: #6fb3f2;  --hl-attr: #d18fe8;
    --hl-type: #59b8c4;    --hl-meta: #a0a1ab;   --hl-builtin: #59b8c4;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --bg-side: #f7f7f8;
    --surface: #ffffff;
    --surface-2: #f3f3f5;
    --surface-3: #eaeaee;
    --border: #e8e8ec;
    --border-strong: #d9d9df;
    --text: #1d1d22;
    --text-2: #5f6068;
    --text-3: #9a9ba3;
    --hover: #f3f3f5;
    --active: #ececef;
    --accent: #e5622a;
    --accent-deep: #d4531c;
    --accent-soft: #fdefe6;
    --accent-border: #f3cdb2;
    --ok: #17803b;      --ok-soft: #e7f4eb;
    --err: #cf3a2c;     --err-soft: #fbecea;
    --warn: #946200;    --warn-soft: #fbf2dc;
    --code-bg: #f7f7f9;
    --code-head: #efeff2;
    --overlay: rgba(24, 24, 30, .38);
    --shadow-md: 0 2px 12px rgba(28, 26, 24, .07);
    --shadow-lg: 0 12px 40px rgba(28, 26, 24, .16);
    --hl-comment: #9a9ba3; --hl-keyword: #c9422a; --hl-string: #2e7d32;
    --hl-number: #a56211;  --hl-title: #1f6fbf;  --hl-attr: #7c3aad;
    --hl-type: #0e7c8c;    --hl-meta: #5f6068;   --hl-builtin: #0e7c8c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI",
                 "PingFang SC", "Microsoft YaHei UI", sans-serif;
    font-size: 14px; color: var(--text);
    background: var(--bg);
    display: flex; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  ::selection { background: var(--accent-soft); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 5px;
    border: 2px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ 左侧栏 ============ */
  #sidebar {
    width: 268px; flex: none; display: flex; flex-direction: column;
    background: var(--bg-side); border-right: 1px solid var(--border);
  }
  .side-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px 12px; font-weight: 700; font-size: 14.5px; letter-spacing: .01em;
  }
  .side-logo .mark {
    width: 28px; height: 28px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #fff; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px var(--accent-soft);
  }

  .menu-item {
    display: flex; align-items: center; gap: 10px;
    width: calc(100% - 20px); margin: 1px 10px; padding: 0 10px;
    height: 36px; border: none; background: none; border-radius: var(--r-sm);
    font-size: 13px; color: var(--text-2); text-align: left; flex: none;
    transition: background .12s, color .12s;
  }
  .menu-item:hover { background: var(--hover); color: var(--text); }
  .menu-item svg { color: var(--text-3); flex: none; }
  .menu-item:hover svg { color: var(--text-2); }
  .menu-item kbd {
    margin-left: auto; font-family: inherit; font-size: 11px; color: var(--text-3);
  }

  /* 分组 / 项目 分段切换 */
  #side-tabs-row {
    display: flex; align-items: center; gap: 6px;
    margin: 14px 14px 4px; flex: none;
  }
  .seg { flex: 1; display: flex; background: var(--surface-2); border-radius: var(--r-sm); padding: 2px; }
  .seg button {
    flex: 1; height: 26px; border: none; background: none; border-radius: 6px;
    font-size: 12.5px; color: var(--text-3); transition: all .12s;
  }
  .seg button.on {
    background: var(--surface-3); color: var(--text); font-weight: 600;
  }
  .seg-acts { display: flex; gap: 2px; }
  .icon-btn {
    width: 27px; height: 27px; border: none; background: none; border-radius: 7px;
    color: var(--text-3); display: inline-flex; align-items: center; justify-content: center;
    flex: none; transition: all .12s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  #search-box { display: none; margin: 6px 14px 2px; flex: none; }
  #search-box.open { display: block; }
  #search-input {
    width: 100%; height: 30px; border: 1px solid var(--border-strong);
    border-radius: var(--r-sm); padding: 0 10px; font-size: 12.5px;
    background: var(--surface); color: var(--text); font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  #search-input:focus {
    outline: none; border-color: var(--accent-border);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  #side-scroll { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  .list-label {
    font-size: 11px; color: var(--text-3); margin: 14px 18px 5px; flex: none;
    font-weight: 600; letter-spacing: .04em;
  }
  .list-empty { font-size: 12.5px; color: var(--text-3); margin: 4px 18px; }

  .session-item {
    position: relative; display: flex; align-items: center; gap: 8px;
    width: calc(100% - 16px); margin: 1px 8px; padding: 0 8px 0 12px; height: 34px;
    border-radius: var(--r-sm); cursor: pointer; transition: background .12s;
  }
  .session-item::before {
    content: ""; position: absolute; left: 2px; top: 9px; bottom: 9px; width: 3px;
    border-radius: 2px; background: var(--accent);
    opacity: 0; transition: opacity .12s;
  }
  .session-item:hover { background: var(--hover); }
  .session-item.active { background: var(--active); }
  .session-item.active::before { opacity: 1; }
  .session-item .s-ico { flex: none; color: var(--text-3); display: inline-flex; }
  .session-item .title {
    flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-item.unnamed .title { color: var(--text-3); font-style: italic; }
  .session-item .meta { flex: none; font-size: 11px; color: var(--text-3); }
  .session-item .s-del, .session-item .s-ren {
    display: none; flex: none;
    width: 25px; height: 25px; padding: 0;
    border: none; background: none; border-radius: 7px;
    color: var(--text-2); align-items: center; justify-content: center;
    transition: all .12s;
  }
  .session-item:hover .s-del, .session-item:hover .s-ren { display: inline-flex; }
  .session-item:hover .meta { display: none; }   /* 悬停时时间让位给操作钮 */
  .session-item .s-del { margin-right: 2px; }
  .session-item .s-del:hover { color: var(--err); background: var(--err-soft); }
  .session-item .s-ren:hover { color: var(--accent); background: var(--accent-soft); }
  .session-item.renaming .title, .session-item.renaming .meta,
  .session-item.renaming .s-del, .session-item.renaming .s-ren { display: none; }
  /* 并行运行态: 运行中脉冲点 / 排队/未读红点 */
  .session-item .s-run {
    display: none; flex: none; width: 14px; height: 14px;
    align-items: center; justify-content: center;
  }
  .session-item.running .s-run { display: inline-flex; }
  .session-item.running .meta { display: none; }
  .session-item.running .s-run::after {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: pulse 1.2s infinite;
  }
  .session-item .s-unread {
    display: none; flex: none; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 600; line-height: 16px; text-align: center;
  }
  .session-item.unread .s-unread { display: inline-block; }
  .session-item.unread .meta { display: none; }
  .session-item.running.unread .s-unread { display: none; }
  .inline-rename {
    flex: 1; min-width: 0; height: 24px;
    font-family: inherit; font-size: 12.5px; color: var(--text);
    background: var(--surface); border: 1px solid var(--accent); border-radius: 6px;
    padding: 0 7px;
  }
  .inline-rename:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

  /* 底栏: 连接状态 + 主题切换 */
  .side-bottom {
    flex: none; border-top: 1px solid var(--border);
    padding: 10px 12px; display: flex; align-items: center; gap: 8px;
  }
  .side-bottom .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: var(--surface-3); color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center;
  }
  #conn-state {
    display: inline-flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    font-size: 12px; color: var(--text-2);
  }
  #conn-state .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex: none;
  }
  #conn-state.on .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  #conn-state.err .dot { background: var(--err); }

  /* ============ 右侧主区 ============ */
  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); position: relative; }
  /* 顶部氛围光: 深色下一抹暖色渐晕，增加纵深 */
  #pane::before {
    content: ""; position: absolute; top: -160px; left: 50%; transform: translateX(-50%);
    width: 680px; height: 320px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--accent-soft), transparent 72%);
    pointer-events: none; z-index: 0; opacity: .9;
  }
  #doc-header, #messages, #composer { position: relative; z-index: 1; }

  /* 文档标题栏 */
  #doc-header {
    flex: none; display: flex; align-items: center; gap: 10px;
    height: 56px; padding: 0 22px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(8px);
  }
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    #doc-header { background: var(--bg); }
  }
  #doc-title {
    font-size: 15px; font-weight: 600; color: var(--text);
    max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: text;
  }
  #doc-title:hover { color: var(--accent); }
  .doc-title-input {
    width: 300px; max-width: 36vw;
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--surface); border: 1px solid var(--accent); border-radius: 6px;
    padding: 3px 8px;
  }
  .doc-title-input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .ws-tag {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3.5px 11px;
    font-size: 12px; color: var(--text-2);
  }
  .ws-tag svg { color: var(--text-3); }
  #doc-header .spacer { flex: 1; }

  /* ============ 聊天区 ============ */
  #messages { flex: 1; overflow-y: auto; scroll-behavior: auto; }
  /* 每个会话一个常驻消息列, 切换只是显隐: 后台会话的流式输出继续写进
     自己的隐藏列, 切回时原样恢复——流式中的回复不丢字、不冻结 */
  .msg-col { max-width: 860px; margin: 0 auto; padding: 28px 32px 12px; display: none; }
  .msg-col.on { display: block; }

  /* 空状态 */
  .empty-state { text-align: center; padding-top: 12vh; }
  .empty-state .mark {
    width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #fff; font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 34px var(--accent-soft);
    animation: orb-in .5s ease;
  }
  @keyframes orb-in { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .empty-state h2 { font-size: 19px; font-weight: 700; margin-bottom: 7px; }
  .empty-state p { color: var(--text-2); font-size: 13px; margin-bottom: 26px; }
  .sug-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .sug-chip {
    padding: 10px 16px; border: 1px solid var(--border-strong); border-radius: var(--r-md);
    background: var(--surface); color: var(--text-2); font-size: 13px;
    transition: all .15s;
  }
  .sug-chip:hover {
    border-color: var(--accent-border); color: var(--accent);
    background: var(--accent-soft); transform: translateY(-1px);
  }

  /* 用户消息: 右对齐气泡 */
  .msg { display: flex; margin-bottom: 22px; animation: msg-in .22s ease; }
  @keyframes msg-in { from { transform: translateY(5px); opacity: 0; } to { transform: none; opacity: 1; } }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 76%; padding: 10px 16px;
    background: var(--accent-soft); border: 1px solid var(--accent-border);
    border-radius: var(--r-lg); border-bottom-right-radius: 6px;
    font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  /* 排队中的后续消息: 半透明 + 「已排队」徽标, 轮到它时转正 */
  .msg.user.queued .bubble { opacity: .6; }
  .q-chip {
    display: inline-flex; align-items: center; margin-left: 8px;
    padding: 1px 8px; border-radius: 999px;
    background: var(--surface-3); color: var(--text-3);
    font-size: 11px; vertical-align: 1px; white-space: nowrap;
  }

  /* assistant 消息: 头像 + 无框正文（文档感） */
  .msg.assistant { gap: 11px; }
  .msg.assistant .avatar {
    flex: none; width: 27px; height: 27px; margin-top: 2px;
    border-radius: 9px; color: #fff; font-size: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px var(--accent-soft);
  }
  .msg.assistant .bubble {
    flex: 1; min-width: 0; font-size: 14px; line-height: 1.75; word-break: break-word;
  }

  /* assistant markdown */
  .bubble p { margin: 0 0 .65em; } .bubble p:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: .95em 0 .45em; line-height: 1.4; }
  .bubble h1 { font-size: 1.3em; } .bubble h2 { font-size: 1.18em; } .bubble h3 { font-size: 1.06em; }
  .bubble ul, .bubble ol { margin: .4em 0 .7em 1.5em; }
  .bubble li { margin: .2em 0; }
  .bubble li::marker { color: var(--text-3); }
  .bubble code {
    font-family: "Cascadia Code", Consolas, "JetBrains Mono", monospace; font-size: .9em;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 1.5px 6px; border-radius: 5px;
  }
  .bubble a { color: var(--accent); }
  .bubble table { border-collapse: collapse; margin: .6em 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border-strong); padding: 6px 11px; }
  .bubble th { background: var(--surface-2); font-weight: 600; }
  .bubble blockquote {
    border-left: 3px solid var(--accent-border); margin: .6em 0;
    padding: 2px 0 2px 12px; color: var(--text-2);
  }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }

  /* 代码块: 带语言标签 + 复制按钮的卡片 */
  .code-wrap {
    border: 1px solid var(--border); border-radius: var(--r-md);
    overflow: hidden; margin: .6em 0; background: var(--code-bg);
  }
  .code-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px 6px 13px; background: var(--code-head);
    border-bottom: 1px solid var(--border);
  }
  .code-lang {
    font-size: 11px; color: var(--text-3); font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .code-copy {
    display: inline-flex; align-items: center; gap: 5px;
    border: none; background: none; border-radius: 6px;
    padding: 3.5px 8px; font-size: 11.5px; color: var(--text-3);
    transition: all .12s;
  }
  .code-copy:hover { background: var(--surface-3); color: var(--text); }
  .code-copy.copied { color: var(--ok); }
  .bubble pre {
    background: var(--code-bg); margin: 0; border-radius: 0;
    padding: 13px 15px; overflow-x: auto;
  }
  .bubble pre code {
    background: none; border: none; padding: 0;
    font-size: 12.5px; line-height: 1.6; color: var(--text);
  }
  /* hljs 语法配色（跟随主题令牌） */
  .hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-formula { color: var(--hl-keyword); }
  .hljs-string, .hljs-regexp, .hljs-addition { color: var(--hl-string); }
  .hljs-number, .hljs-symbol, .hljs-bullet, .hljs-link, .hljs-deletion { color: var(--hl-number); }
  .hljs-title, .hljs-section, .hljs-name, .hljs-selector-id, .hljs-selector-class { color: var(--hl-title); }
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-property { color: var(--hl-attr); }
  .hljs-type, .hljs-built_in, .hljs-class .hljs-title { color: var(--hl-type); }
  .hljs-meta, .hljs-meta .hljs-keyword, .hljs-tag { color: var(--hl-meta); }
  .hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 600; }

  /* 思考行: 实时「思考中…」→ 收口为「思考 · 持续了X秒」 */
  .think-row {
    display: flex; align-items: center; gap: 7px;
    margin: 2px 0 12px 38px; padding: 5px 11px;
    width: fit-content;
    font-size: 12.5px; color: var(--text-3);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px;
  }
  .think-row .t-ico { flex: none; display: inline-flex; color: var(--text-3); }
  .think-row.thinking { color: var(--text-2); }
  .think-row .shine {
    background: linear-gradient(90deg, var(--text-3) 30%, var(--text) 50%, var(--text-3) 70%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: shine 1.8s linear infinite;
  }
  @keyframes shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* 工具调用行: 一行式灰色条目（与 CLI 观感一致），纯展示、无展开 */
  .tool-row {
    display: flex; align-items: center; gap: 7px;
    margin: 2px 0 10px 38px; padding: 4px 9px;
    font-size: 12.5px; color: var(--text-3);
    animation: msg-in .22s ease;
  }
  .tool-row .t-ico { flex: none; display: inline-flex; }
  .tool-row .tname2 { flex: none; color: var(--text-2); }
  .tool-row .tdesc {
    flex: 0 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px;
  }
  .tool-row .tstate { flex: none; }
  .tstate::before { content: "· "; }
  .tstate.run { animation: pulse 1.2s infinite; }
  .tstate.err { color: var(--err); }
  .tstate.denied { color: var(--warn); }
  .tstate.stopped { color: var(--warn); }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* 提示条（警告/错误） */
  .note {
    max-width: fit-content; margin: 0 0 18px; padding: 8px 14px;
    border-radius: var(--r-md); font-size: 13px;
    border: 1px solid transparent;
    animation: msg-in .22s ease;
  }
  .note.warn { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
  .note.err  { color: var(--err); background: var(--err-soft); border-color: color-mix(in srgb, var(--err) 26%, transparent); }
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    .note.warn { border-color: transparent; } .note.err { border-color: transparent; }
  }

  /* 回到底部悬浮钮 */
  #scroll-btn {
    position: absolute; right: 34px; bottom: 168px; z-index: 5;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-2); box-shadow: var(--shadow-md);
    display: none; align-items: center; justify-content: center;
    transition: all .15s;
  }
  #scroll-btn.show { display: inline-flex; }
  #scroll-btn:hover { color: var(--text); border-color: var(--accent-border); }

  /* ============ 底部输入卡片 ============ */
  #composer { flex: none; padding: 6px 32px 18px; }
  #thinking {
    display: none; max-width: 860px; margin: 0 auto 8px; padding-left: 6px;
    align-items: center; gap: 9px;
  }
  #thinking .dots { display: inline-flex; gap: 4px; }
  #thinking .dots i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  #thinking .dots i:nth-child(2) { animation-delay: .15s; }
  #thinking .dots i:nth-child(3) { animation-delay: .3s; }
  #thinking .t { color: var(--text-3); font-size: 12.5px; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

  #input-card {
    max-width: 860px; margin: 0 auto;
    border: 1px solid var(--border-strong); border-radius: var(--r-xl);
    background: var(--surface); box-shadow: var(--shadow-lg);
    padding: 13px 14px 11px 17px;
    transition: border-color .15s, box-shadow .15s;
  }
  #input-card:focus-within {
    border-color: var(--accent-border);
    box-shadow: var(--shadow-lg), 0 0 0 3px var(--accent-soft);
  }
  #input {
    width: 100%; resize: none; border: none; background: none;
    color: var(--text); font-family: inherit; font-size: 14px;
    line-height: 1.55; max-height: 160px; padding: 2px 0 10px;
    display: block;
  }
  #input:focus { outline: none; }
  #input::placeholder { color: var(--text-3); }
  .comp-row { display: flex; align-items: center; gap: 6px; }
  .comp-row .spacer { flex: 1; }

  .round-btn {
    width: 28px; height: 28px; border: none; background: none; border-radius: 50%;
    color: var(--text-3); display: inline-flex; align-items: center; justify-content: center;
    flex: none; transition: all .12s;
  }
  .round-btn:hover { background: var(--hover); color: var(--text); }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; height: 28px;
    padding: 0 5px; border-radius: 8px; flex: none;
  }
  .pill:hover { background: var(--hover); }
  .pill > svg { flex: none; }
  .pill.mode { color: var(--accent); }
  .pill.mode > svg { margin-left: 3px; }
  .pill.effort .ring {
    width: 12px; height: 12px; border: 1.7px solid var(--text-3); border-radius: 50%;
    flex: none; margin-left: 3px;
  }
  .pill .model-name { font-size: 12.5px; color: var(--text-2); padding: 0 4px; }

  /* 自定义下拉: 原生 select 的弹层无法定制样式，深浅主题下都突兀 */
  .dd {
    display: inline-flex; align-items: center; gap: 5px;
    height: 28px; border: none; background: none;
    font-family: inherit; font-size: 12.5px; color: var(--text-2);
    padding: 0 4px; border-radius: 7px;
  }
  .pill.mode .dd { color: var(--accent); font-weight: 600; }
  .dd .dd-chev { flex: none; display: inline-flex; color: var(--text-3); transition: transform .15s; }
  .pill.mode .dd .dd-chev { color: var(--accent); }
  .dd.open .dd-chev { transform: rotate(180deg); }
  .dd-pop {
    position: fixed; z-index: 300; min-width: 148px;
    display: flex; flex-direction: column; padding: 5px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--r-md); box-shadow: var(--shadow-lg);
    animation: rise .14s ease;
  }
  .dd-opt {
    display: flex; align-items: center; gap: 6px;
    border: none; background: none; text-align: left;
    padding: 7px 9px; border-radius: 8px;
    font-family: inherit; font-size: 12.5px; color: var(--text-2);
    transition: background .1s;
  }
  .dd-opt:hover { background: var(--hover); color: var(--text); }
  .dd-opt.on { color: var(--accent); font-weight: 600; }
  .dd-opt .dd-check { flex: none; visibility: hidden; display: inline-flex; }
  .dd-opt.on .dd-check { visibility: visible; }

  #btn-send {
    width: 32px; height: 32px; border: none; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    flex: none; margin-left: 3px; transition: all .15s;
    box-shadow: 0 2px 10px var(--accent-soft);
  }
  #btn-send:hover:not(:disabled) { transform: scale(1.06); }
  #btn-send:active:not(:disabled) { transform: scale(.97); }
  #btn-send:disabled {
    background: var(--surface-3); color: var(--text-3);
    cursor: not-allowed; box-shadow: none;
  }
  #btn-stop {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1.5px solid var(--err); background: transparent; color: var(--err);
    display: none; align-items: center; justify-content: center;
    flex: none; margin-left: 3px; transition: all .15s;
  }
  #btn-stop:hover { background: var(--err-soft); transform: scale(1.06); }

  /* 工作目录 chip（草稿态选择项目目录） */
  .wd-chip {
    display: none; align-items: center; gap: 5px; height: 28px;
    padding: 0 9px; border-radius: 8px; border: none; background: none;
    color: var(--text-2); font-size: 12.5px; flex: none; max-width: 200px;
  }
  .wd-chip:hover { background: var(--hover); }
  .wd-chip.show { display: inline-flex; }
  .wd-chip #wd-chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 目录选择弹层 */
  #dir-pop {
    display: none; position: fixed; z-index: 150;
    width: 340px; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--r-md);
    box-shadow: var(--shadow-lg);
    padding: 12px; flex-direction: column; gap: 8px;
  }
  #dir-pop.open { display: flex; }
  .dir-title { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .dir-path-row { display: flex; align-items: center; gap: 5px; }
  #dir-path-input {
    flex: 1; min-width: 0; height: 28px;
    border: 1px solid var(--border-strong); border-radius: 7px;
    padding: 0 9px; font-size: 12px; font-family: "Cascadia Code", Consolas, monospace;
    color: var(--text); background: var(--bg);
  }
  #dir-path-input:focus { outline: none; border-color: var(--accent-border); }
  #dir-list {
    max-height: 210px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 8px;
  }
  .dir-item {
    display: flex; align-items: center; gap: 7px;
    padding: 6.5px 10px; font-size: 12.5px; color: var(--text);
    cursor: pointer;
  }
  .dir-item:hover { background: var(--hover); }
  .dir-item svg { color: var(--text-3); flex: none; }
  .dir-empty { padding: 12px 10px; font-size: 12px; color: var(--text-3); }
  .dir-err { font-size: 11.5px; color: var(--err); display: none; padding: 0 2px; }
  .dir-err.show { display: block; }
  .dir-actions { display: flex; justify-content: flex-end; }
  #dir-pick {
    padding: 6px 16px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #fff; font-size: 12.5px; font-weight: 600;
  }
  #dir-pick:hover { filter: brightness(1.08); }

  /* ============ 权限审批 ============ */
  #perm-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: var(--overlay); backdrop-filter: blur(3px);
    align-items: center; justify-content: center;
  }
  #perm-modal {
    width: min(560px, 92vw); background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
    padding: 20px 22px; animation: rise .18s ease;
  }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  #perm-modal h3 {
    font-size: 15px; margin-bottom: 14px; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  #perm-modal h3 svg { color: var(--accent); }
  #perm-modal .field { margin-bottom: 10px; font-size: 13px; }
  #perm-modal .field .k {
    display: inline-block; min-width: 42px; color: var(--text-3); margin-right: 10px;
  }
  #perm-modal pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 11px;
    max-height: 220px; overflow: auto; font-size: 12px;
    font-family: "Cascadia Code", Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    margin-top: 5px;
  }
  #perm-modal .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  #perm-modal .btns button {
    padding: 8px 24px; border-radius: var(--r-sm); font-size: 13.5px; font-weight: 600;
    border: 1px solid var(--border-strong); background: transparent; color: var(--text);
    transition: all .12s;
  }
  #perm-modal .btns button:hover { background: var(--hover); }
  #btn-allow {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep)) !important;
    border-color: transparent !important; color: #fff !important;
    box-shadow: 0 2px 10px var(--accent-soft);
  }
  #btn-allow:hover { filter: brightness(1.08) !important; background: linear-gradient(135deg, var(--accent), var(--accent-deep)) !important; }
  #btn-deny { color: var(--err) !important; border-color: var(--err) !important; }
  #btn-deny:hover { background: var(--err-soft) !important; }

  /* 轻提示 */
  #toast {
    position: fixed; left: 50%; bottom: 96px; z-index: 200;
    transform: translateX(-50%) translateY(6px);
    background: var(--surface-3); color: var(--text);
    border: 1px solid var(--border-strong);
    font-size: 12.5px; padding: 8px 16px; border-radius: 999px;
    box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: all .18s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ============ 左侧栏 ============ -->
<aside id="sidebar">
  <div class="side-logo"><span class="mark">✻</span>x-code</div>

  <button class="menu-item" id="btn-new" title="新建会话">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/></svg>
    新建任务<kbd>Ctrl+N</kbd>
  </button>
  <button class="menu-item" id="btn-search" title="搜索会话">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    搜索<kbd>Ctrl+K</kbd>
  </button>
  <button class="menu-item" data-stub title="敬请期待">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2.5L4.5 14H11l-1.5 7.5L18 10h-6.5L13 2.5z"/></svg>
    自动化
  </button>
  <button class="menu-item" data-stub title="敬请期待">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
    插件市场
  </button>

  <div id="side-tabs-row">
    <div class="seg">
      <button id="tab-group">分组</button>
      <button id="tab-project" class="on">项目</button>
    </div>
    <div class="seg-acts">
      <button class="icon-btn" id="btn-filter" title="搜索">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16l-6.2 7.2V18l-3.6 2v-7.8L4 5z"/></svg>
      </button>
      <button class="icon-btn" data-stub title="敬请期待">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13"/></svg>
      </button>
    </div>
  </div>

  <div id="search-box"><input id="search-input" type="text" placeholder="搜索会话标题…"></div>

  <div id="side-scroll">
    <div id="session-list"></div>
    <div class="list-label">任务</div>
    <div class="list-empty">还没有任务</div>
  </div>

  <div class="side-bottom">
    <span class="avatar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.4 4-5 7-5s5.8 1.6 7 5"/></svg>
    </span>
    <span id="conn-state"><span class="dot"></span><span id="conn-text">连接中…</span></span>
    <button class="icon-btn" id="btn-theme" title="切换主题">
      <svg id="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
      <svg id="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" style="display:none"><path d="M20.5 13.2A8.5 8.5 0 1110.8 3.5a7 7 0 009.7 9.7z"/></svg>
    </button>
  </div>
</aside>

<!-- ============ 右侧主区 ============ -->
<div id="pane">
  <header id="doc-header">
    <span id="doc-title">未命名任务</span>
    <span class="ws-tag" id="ws-tag" title="工作目录">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      <span id="ws-tag-text">workplace</span>
    </span>
    <button class="icon-btn" data-stub title="敬请期待">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
    </button>
    <span class="spacer"></span>
  </header>

  <div id="messages"></div>

  <button id="scroll-btn" title="回到底部">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5.5 12.5L12 19l6.5-6.5"/></svg>
  </button>

  <div id="composer">
    <div id="thinking"><span class="dots"><i></i><i></i><i></i></span><span class="t">思考中…</span></div>
    <div id="input-card">
      <textarea id="input" rows="1" placeholder="提出后续修改要求" title="Enter 发送 · Shift+Enter 换行 · 对话与 CLI 共享同一份历史"></textarea>
      <div class="comp-row">
        <button id="btn-plus" class="round-btn" data-stub title="添加附件（敬请期待）">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="wd-chip" class="wd-chip" title="会话工作目录">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
          <span id="wd-chip-text">选择工作目录</span>
          <svg width="9" height="6" viewBox="0 0 9 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 1l3.5 3.5L8 1"/></svg>
        </button>
        <span class="pill mode" title="权限模式">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l7 2.8v5.4c0 4.4-2.9 7.8-7 9.8-4.1-2-7-5.4-7-9.8V5.8L12 3z"/></svg>
          <button type="button" class="dd" id="sel-mode">
            <span class="dd-label">每次询问</span>
            <span class="dd-chev"><svg width="9" height="6" viewBox="0 0 9 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 1l3.5 3.5L8 1"/></svg></span>
          </button>
        </span>
        <span class="spacer"></span>
        <span class="pill model" id="pill-model" title="当前模型">
          <span class="model-name" id="model-name">…</span>
        </span>
        <span class="pill effort" title="思考等级">
          <span class="ring"></span>
          <button type="button" class="dd" id="sel-thinking">
            <span class="dd-label">中</span>
            <span class="dd-chev"><svg width="9" height="6" viewBox="0 0 9 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 1l3.5 3.5L8 1"/></svg></span>
          </button>
        </span>
        <button id="btn-send" title="发送">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
        </button>
        <button id="btn-stop" title="停止本轮">
          <svg width="12" height="12" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 权限审批模态框 -->
<div id="perm-overlay">
  <div id="perm-modal">
    <h3>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l7 2.8v5.4c0 4.4-2.9 7.8-7 9.8-4.1-2-7-5.4-7-9.8V5.8L12 3z"/></svg>
      <span id="perm-title">需要授权</span>
    </h3>
    <div class="field"><span class="k">工具</span><span id="perm-tool"></span></div>
    <div class="field"><span class="k">权限</span><span id="perm-mode"></span></div>
    <div class="field"><span class="k">内容</span><pre id="perm-input"></pre></div>
    <div class="btns">
      <button id="btn-deny">拒绝</button>
      <button id="btn-allow">允许</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- 工作目录选择器（草稿态） -->
<div id="dir-pop">
  <div class="dir-title">选择工作目录</div>
  <div class="dir-path-row">
    <button class="icon-btn" id="dir-up" title="上一级">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
    </button>
    <input id="dir-path-input" spellcheck="false" placeholder="输入目录路径，回车跳转">
    <button class="icon-btn" id="dir-go" title="转到">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div id="dir-list"></div>
  <div class="dir-err" id="dir-err"></div>
  <div class="dir-actions">
    <button id="dir-pick">使用此目录</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
 * 状态
 * ============================================================ */
const $ = id => document.getElementById(id);
const state = {
  sessionId: null,          // 当前"可见"的会话 id（null = 草稿/无）
  sessions: [],             // 全量会话列表（loadSessions 填充）
  sideTab: "project",       // 侧栏列表模式: project | group
  draft: false,             // 草稿态: 已点"新建"但还没发首条消息（不建条目）
  draftWorkdir: null,       // 草稿态选择的工作目录（项目的意义）
  serverWorkspace: null,    // 服务进程工作区名（无会话目录时的兜底展示）
  runs: {},                 // sessionId → 运行态（多会话并行: 各自 WS/流式指针/审批）
};

/* 一个会话的运行态。多会话并行的核心: 每个会话有自己的 WebSocket、
   流式 DOM 指针、权限审批、未读数。切换会话只是换"可见"的 id,
   后台会话的 WS 与轮次照常跑; 回到前台时按需重拉历史对齐。 */
function runOf(id) {
  if (!state.runs[id]) {
    state.runs[id] = {
      ws: null,               // 该会话的 WebSocket
      busy: false,            // 一轮对话进行中（含排队等待槽位）
      queued: false,          // 在全局并发队列中等待槽位
      pendingPerm: null,      // 待审批的 permission_request
      activeToolCard: null,   // 当前流式中的工具卡片（配对 tool_result）
      curBubble: null,        // 当前流式中的正文气泡
      curThinking: null,      // 当前流式中的思考行 { el, t0 }
      toolResultIndex: {},    // 历史回放: tool_use id → 卡片（等结果块配对）
      currentWorkdir: null,   // 该会话的工作目录（messages 接口返回）
      pendingSends: [],       // WS 建立期间待发的消息（onopen 后冲刷）
      unread: 0,              // 后台完成/待审批的未读计数
      loaded: false,          // 历史是否已加载过（首次切入必拉）
      loading: false,         // 历史加载进行中（防并发重复拉取）
    };
  }
  return state.runs[id];
}
const curRun = () => (state.sessionId ? runOf(state.sessionId) : null);

/* ============================================================
 * 会话消息列: 每个会话一个常驻 DOM 列, 切换会话只做显隐。
 * 后台会话的流式事件继续写进自己的隐藏列, 切回原样恢复——
 * 不再"回前台重拉历史", 流式进行中的回复也不丢字、不冻结。
 * ============================================================ */
let pinnedCol = null;   // 历史回放期间固定写入列（JS 单线程, 用完置回）
let pinnedRun = null;   // 回放期间 toolResultIndex 写入的目标 run

function colOf(id) {
  let col = document.getElementById("msg-col-" + id);
  if (!col) {
    col = document.createElement("div");
    col.id = "msg-col-" + id;
    col.className = "msg-col";
    $("messages").appendChild(col);
  }
  return col;
}
function showCol(id) {
  document.querySelectorAll("#messages .msg-col").forEach(c => {
    c.classList.toggle("on", c.id === "msg-col-" + id);
  });
}

/* ============================================================
 * 主题: 深色默认, localStorage 持久化
 * ============================================================ */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem("xc-theme", t);
  // 图标显示"将切换到"的目标: 深色时显示太阳
  $("icon-sun").style.display = t === "dark" ? "" : "none";
  $("icon-moon").style.display = t === "dark" ? "none" : "";
}
$("btn-theme").onclick = () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
};
applyTheme(document.documentElement.dataset.theme || "dark");

/* ============================================================
 * markdown 渲染: marked.js 优先，加载失败降级为转义纯文本;
 * 代码块外加语言标签/复制按钮，hljs 可用时做语法高亮
 * ============================================================ */
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
function renderMd(text) {
  if (window.marked && window.marked.parse) {
    try {
      return window.marked.parse(text, { breaks: true, gfm: true });
    } catch (e) { /* 落到降级 */ }
  }
  return "<p>" + escapeHtml(text).replace(/\n/g, "<br>") + "</p>";
}

const COPY_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>';
const CHECK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>';

function decorateCode(root) {
  if (!root || !root.querySelectorAll) return;
  root.querySelectorAll("pre:not([data-dec])").forEach(pre => {
    pre.setAttribute("data-dec", "1");
    const code = pre.querySelector("code");
    let lang = "";
    if (code) {
      const m = /language-([\w+-]+)/.exec(code.className || "");
      if (m) lang = m[1];
      if (window.hljs && pre.textContent.length < 60000) {
        try { window.hljs.highlightElement(code); } catch (e) { /* 高亮失败静默 */ }
      }
    }
    const wrap = document.createElement("div");
    wrap.className = "code-wrap";
    const head = document.createElement("div");
    head.className = "code-head";
    head.innerHTML =
      '<span class="code-lang"></span>' +
      '<button class="code-copy" type="button">' + COPY_SVG + '<span>复制</span></button>';
    head.querySelector(".code-lang").textContent = lang || "代码";
    pre.replaceWith(wrap);
    wrap.appendChild(head);
    wrap.appendChild(pre);
  });
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { /* ignore */ }
    ta.remove();
    return ok;
  }
}

/* 复制按钮事件委托（流式重渲染会让节点反复重建，不能逐个绑） */
document.addEventListener("click", ev => {
  const btn = ev.target.closest(".code-copy");
  if (!btn) return;
  const wrap = btn.closest(".code-wrap");
  const pre = wrap && wrap.querySelector("pre");
  if (!pre) return;
  copyText(pre.innerText).then(ok => {
    if (!ok) { toast("复制失败"); return; }
    btn.classList.add("copied");
    btn.innerHTML = CHECK_SVG + "<span>已复制</span>";
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.innerHTML = COPY_SVG + "<span>复制</span>";
    }, 1400);
  });
});

/* ============================================================
 * 轻提示
 * ============================================================ */
let toastTimer = null;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

/* ============================================================
 * 滚动: 贴底自动跟随; 用户上翻时不拽人, 悬浮钮一键回底
 * ============================================================ */
let nearBottom = true;
$("messages").addEventListener("scroll", () => {
  const el = $("messages");
  nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  $("scroll-btn").classList.toggle("show", !nearBottom);
});
$("scroll-btn").onclick = () => {
  nearBottom = true;
  $("messages").scrollTo({ top: $("messages").scrollHeight, behavior: "smooth" });
};
function scrollToBottom(force) {
  if (!force && !nearBottom) return;
  const el = $("messages");
  el.scrollTop = el.scrollHeight;
}

/* ============================================================
 * 侧栏会话列表（项目 / 分组 两种模式 + 搜索过滤）
 * ============================================================ */
function sessionDate(id) {
  // 会话 id 是 %Y%m%d-%H%M%S 时间戳（可能有 "w" 后缀防撞）
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/.exec(id);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function relativeTime(id) {
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/.exec(id);
  if (!m) return "";
  const then = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
  const diff = (Date.now() - then.getTime()) / 1000;
  if (diff < 90) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + "分钟";
  if (diff < 86400) return Math.floor(diff / 3600) + "小时";
  if (diff < 172800) return "1天";
  if (diff < 604800) return Math.floor(diff / 86400) + "天";
  return `${+m[2]}/${+m[3]}`;
}
function sessionBucket(id) {
  const d = sessionDate(id);
  if (!d) return 3;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.floor((today - d) / 86400000);
  if (days <= 0) return 0;      // 今天
  if (days === 1) return 1;     // 昨天
  if (days < 7) return 2;       // 7 天内
  return 3;                     // 更早
}
const BUCKET_LABELS = ["今天", "昨天", "7 天内", "更早"];
const FOLDER_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>';
const UNTITLED_TITLE = "未命名任务";

function displayTitle(s) {
  return (!s || s.title === "(未命名)") ? UNTITLED_TITLE : s.title;
}

async function loadSessions() {
  try {
    const r = await fetch("/api/sessions");
    const data = await r.json();
    state.sessions = data.sessions;
    renderSessionList();
  } catch (e) { console.error("加载会话列表失败", e); }
}

const TRASH_SMALL_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13"/></svg>';
const PENCIL_SMALL_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.5-1L20 7.5 16.5 4 5 15.5 4 20z"/></svg>';

async function renameSession(id, title) {
  try {
    const r = await fetch(`/api/sessions/${id}/rename`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || r.status);
    }
    const s = state.sessions.find(x => x.id === id);
    if (s) s.title = title;
    renderSessionList();
    if (id === state.sessionId) refreshDocTitle();
  } catch (e) {
    toast("重命名失败: " + e.message);
  }
}

/* 通用行内编辑框: Enter/失焦提交，Esc 取消；onDone 无论提交与否都会回调 */
function makeInlineEditor(initial, onCommit, onDone) {
  const input = document.createElement("input");
  input.className = "inline-rename";
  input.maxLength = 60;
  input.value = initial;
  const finish = commit => {
    if (input._done) return;
    input._done = true;
    const val = input.value.trim();
    input.remove();
    if (commit && val && val !== initial) onCommit(val);
    if (onDone) onDone(commit);
  };
  input.onclick = ev => ev.stopPropagation();
  input.onkeydown = ev => {
    ev.stopPropagation();   // 别让按键冒泡成全局快捷键
    if (ev.key === "Enter") finish(true);
    else if (ev.key === "Escape") finish(false);
  };
  input.onblur = () => finish(true);
  requestAnimationFrame(() => { input.focus(); input.select(); });
  return input;
}

function makeSessionItem(s) {
  const item = document.createElement("div");
  const unnamed = s.title === "(未命名)";
  item.className = "session-item"
    + (s.id === state.sessionId ? " active" : "")
    + (unnamed ? " unnamed" : "");
  item.dataset.id = s.id;
  item.title = `${s.title} · ${s.message_count} 条消息`;
  item.innerHTML = '<span class="s-ico">' + FOLDER_SVG + '</span>'
    + '<span class="s-run" title="运行中"></span><span class="s-unread"></span>'
    + '<span class="title"></span><span class="meta"></span>'
    + '<button class="s-ren" title="重命名">' + PENCIL_SMALL_SVG + '</button>'
    + '<button class="s-del" title="删除会话">' + TRASH_SMALL_SVG + '</button>';
  item.querySelector(".title").textContent = displayTitle(s);
  item.querySelector(".meta").textContent = relativeTime(s.id);
  const run = state.runs[s.id];
  if (run && run.busy) item.classList.add("running");
  if (run && run.unread > 0) {
    item.classList.add("unread");
    item.querySelector(".s-unread").textContent = run.unread > 99 ? "99+" : run.unread;
  }
  item.onclick = () => selectSession(s.id);
  item.querySelector(".s-ren").onclick = ev => {
    ev.stopPropagation();
    if (item.classList.contains("renaming")) return;
    item.classList.add("renaming");   // 编辑期间隐藏标题/时间/按钮
    const input = makeInlineEditor(
      displayTitle(s),
      val => renameSession(s.id, val),
      () => item.classList.remove("renaming"),
    );
    item.appendChild(input);
  };
  item.querySelector(".s-del").onclick = ev => {
    ev.stopPropagation();
    deleteSession(s.id);
  };
  return item;
}

async function deleteSession(id) {
  const run = state.runs[id];
  if (run && run.busy) {
    toast("该会话本轮对话进行中，暂不能删除");
    return;
  }
  const cur = state.sessions.find(s => s.id === id);
  if (!confirm(`删除会话「${displayTitle(cur)}」？删除后不可恢复。`)) return;
  try {
    const r = await fetch(`/api/sessions/${id}`, { method: "DELETE" });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || r.status);
    }
    state.sessions = state.sessions.filter(s => s.id !== id);
    closeWs(id);                 // 断掉该会话的 WS
    delete state.runs[id];       // 运行态一并清理
    const col = document.getElementById("msg-col-" + id);
    if (col) col.remove();       // 消息列一并清理
    renderSessionList();
    if (id === state.sessionId) {
      // 删的是当前会话: 自动切到最近的会话，没有则回草稿态
      state.sessionId = null;
      const next = state.sessions[0];
      if (next) await selectSession(next.id);
      else startDraft();
    }
    toast("会话已删除");
  } catch (e) {
    toast("删除失败: " + e.message);
  }
}

function renderSessionList() {
  const list = $("session-list");
  list.innerHTML = "";
  const q = ($("search-input").value || "").trim().toLowerCase();
  const sessions = state.sessions.filter(
    s => !q
      || (s.title || "").toLowerCase().includes(q)
      || (s.workdir || "").toLowerCase().includes(q));   // 项目路径/目录名也可搜
  if (!sessions.length) {
    list.innerHTML = '<div class="list-empty">' + (q ? "没有匹配的会话" : "还没有会话") + "</div>";
    return;
  }
  const addLabel = text => {
    const l = document.createElement("div");
    l.className = "list-label";
    l.textContent = text;
    list.appendChild(l);
  };
  if (state.sideTab === "group") {
    // 会话按时间倒序，分组标签自然按 今天→更早 顺序出现
    let bucket = -1;
    for (const s of sessions) {
      const b = sessionBucket(s.id);
      if (b !== bucket) { bucket = b; addLabel(BUCKET_LABELS[b]); }
      list.appendChild(makeSessionItem(s));
    }
  } else {
    // 按项目(工作目录)分组: 组标题是目录名, 悬停看完整路径;
    // 没设置工作目录的会话归入「未设置项目」, 永远排在最后。
    const groups = new Map();   // workdir → sessions(时间倒序, 列表本身已倒序)
    for (const s of sessions) {
      const key = s.workdir || "";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(s);
    }
    const named = [...groups.entries()].filter(([k]) => k);
    named.sort((a, b) => b[1][0].id.localeCompare(a[1][0].id));  // 组间按最新会话
    for (const [wd, items] of named) {
      const label = document.createElement("div");
      label.className = "list-label";
      label.textContent = projectDisplayName(wd);
      label.title = wd;          // 悬停显示完整路径
      label.style.maxWidth = "calc(100% - 36px)";
      label.style.overflow = "hidden";
      label.style.textOverflow = "ellipsis";
      label.style.whiteSpace = "nowrap";
      list.appendChild(label);
      for (const s of items) list.appendChild(makeSessionItem(s));
    }
    const loose = groups.get("") || [];
    if (loose.length) {
      addLabel("未设置项目");
      for (const s of loose) list.appendChild(makeSessionItem(s));
    }
  }
}

/* 项目分组的组标题: 与顶栏 ws-tag 一致取目录名(末段), 空路径兜底 */
function projectDisplayName(wd) {
  return dirName(wd) || "未设置项目";
}

function markActiveSession() {
  document.querySelectorAll(".session-item").forEach(el => {
    el.classList.toggle("active", el.dataset.id === state.sessionId);
  });
}

function refreshDocTitle() {
  const cur = state.sessions.find(s => s.id === state.sessionId);
  $("doc-title").textContent = cur ? displayTitle(cur) : UNTITLED_TITLE;
  refreshWorkdirTag();
}

/* ============================================================
 * 工作目录（项目）: 草稿态选择 + 顶栏标签展示
 * ============================================================ */
function dirName(p) { return p ? p.split(/[\\/]/).filter(Boolean).pop() : null; }

function refreshWorkdirTag() {
  // 顶栏标签: 草稿 → 选中的目录; 会话 → 其运行态里的工作目录; 兜底 → 服务进程工作区名
  const run = curRun();
  const wd = state.draft ? state.draftWorkdir : (run ? run.currentWorkdir : null);
  $("ws-tag-text").textContent = dirName(wd) || state.serverWorkspace || "workplace";
  $("ws-tag").title = "工作目录: " + (wd || "服务进程目录");
}

function setDraftWorkdir(path) {
  state.draftWorkdir = path;
  $("wd-chip-text").textContent = dirName(path) || "选择工作目录";
  $("wd-chip").title = "会话工作目录: " + (path || "未设置（用服务进程目录）");
  refreshWorkdirTag();
}

function updateWdChipVisibility() {
  // 只有草稿态需要选目录; 会话创建后项目归属显示在顶栏标签
  $("wd-chip").classList.toggle("show", state.draft);
}

const dirPop = $("dir-pop");
let dirBrowsePath = null;

async function browseDir(path) {
  const err = $("dir-err");
  err.classList.remove("show");
  try {
    const q = path ? "?path=" + encodeURIComponent(path) : "";
    const r = await fetch("/api/dirs" + q);
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail || r.status);
    }
    const data = await r.json();
    dirBrowsePath = data.path;
    $("dir-path-input").value = data.path;
    const list = $("dir-list");
    list.innerHTML = "";
    if (!data.dirs.length) {
      list.innerHTML = '<div class="dir-empty">此目录下没有子目录</div>';
      return;
    }
    for (const name of data.dirs) {
      const it = document.createElement("div");
      it.className = "dir-item";
      it.innerHTML = FOLDER_SVG + '<span></span>';
      it.querySelector("span").textContent = name;
      it.onclick = () => browseDir(dirBrowsePath.replace(/[\\/]+$/, "") + "\\" + name);
      list.appendChild(it);
    }
  } catch (e) {
    err.textContent = "无法读取: " + e.message;
    err.classList.add("show");
  }
}

function openDirPop() {
  const r = $("wd-chip").getBoundingClientRect();
  dirPop.classList.add("open");
  const left = Math.max(10, Math.min(r.left, window.innerWidth - 352));
  dirPop.style.left = left + "px";
  dirPop.style.top = "auto";
  dirPop.style.bottom = (window.innerHeight - r.top + 8) + "px";
  browseDir(state.draftWorkdir || "");
}
function closeDirPop() { dirPop.classList.remove("open"); }

$("wd-chip").onclick = ev => {
  ev.stopPropagation();
  if (!state.draft) return;
  dirPop.classList.contains("open") ? closeDirPop() : openDirPop();
};
$("dir-up").onclick = () => {
  const parts = (dirBrowsePath || "").split(/[\\/]/).filter(Boolean);
  if (!parts.length) return;
  parts.pop();
  if (!parts.length) return;
  // 只剩盘符（如 "D:"）时补上根斜杠，避免 Path("D:") 落到盘符当前目录
  browseDir(parts.length === 1 && /^[a-zA-Z]:$/.test(parts[0]) ? parts[0] + "\\" : parts.join("\\"));
};
function goDirInput() { browseDir($("dir-path-input").value.trim()); }
$("dir-go").onclick = goDirInput;
$("dir-path-input").addEventListener("keydown", ev => {
  ev.stopPropagation();
  if (ev.key === "Enter") goDirInput();
});
$("dir-pick").onclick = () => {

$("doc-title").title = "点击重命名";

/* ============================================================
 * 会话切换 / 新建 / 历史回放
 * ============================================================ */
async function selectSession(id) {
  state.draft = false;
  state.sessionId = id;
  const run = runOf(id);
  markActiveSession();
  refreshDocTitle();
  renderSessionList();          // 未读标识切换
  connectWs(id);                // 已有连接则复用; 旧会话的 WS 原样保留, 后台继续跑
  const col = colOf(id);
  showCol(id);
  // 历史只在首次切入时拉一次; 之后切换不再重拉——流式 DOM 一直活着,
  // 后台轮次的内容就写在本列里, 切回即所见
  if (!run.loaded && !run.loading) {
    run.loading = true;
    col.innerHTML = '<div class="empty-state"><h2>加载中…</h2></div>';
    run.toolResultIndex = {};
    try {
      const r = await fetch(`/api/sessions/${id}/messages`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      run.currentWorkdir = data.workdir || null;
      pinnedCol = col; pinnedRun = run;
      col.innerHTML = "";
      for (const m of data.messages) renderHistoryMessage(m);
      // 历史里的悬空 tool_use（旧打断轮次没写回结果）: 不该永远转圈
      col.querySelectorAll('.tool-row[data-state="run"]').forEach(el => setToolState(el, "stopped"));
      pinnedCol = null; pinnedRun = null;
      run.loaded = true;
    } catch (e) {
      col.innerHTML = "";
      pinnedCol = col; pinnedRun = run;
      addNoteBubble("err", "加载历史失败: " + e.message);
      pinnedCol = null; pinnedRun = null;
    } finally {
      run.loading = false;
    }
  }
  run.unread = 0;               // 回到前台看完了, 未读清零
  renderSessionList();
  refreshWorkdirTag();
  setBusyUi(run.busy);
  setConn(run.ws && run.ws.readyState === 1 ? "on" : "", run.ws ? (run.ws.readyState === 1 ? "已连接" : "连接中…") : "未连接");
  // 有挂着的审批请求: 重新弹出
  if (id === state.sessionId && run.pendingPerm) onPermissionRequest(run.pendingPerm);
  scrollToBottom(true);
}

function startDraft() {
  /* "新建任务"只进入草稿态，不向服务端要 id——首条消息发出时才真正建会话，
     避免侧栏堆一批没有内容的"未命名任务"条目。
     其他会话在跑也允许新建——多会话并行是本来的意义。 */
  state.draft = true;
  state.sessionId = null;
  markActiveSession();
  refreshDocTitle();
  updateWdChipVisibility();
  setDraftWorkdir(state.draftWorkdir);   // 保留上次选择，方便连建同项目会话
  const col = colOf("__draft__");
  col.innerHTML = "";
