<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>x-code</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #f7f6f3; color: #57534e;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #ddd6cb; border-top-color: #b45309;
    animation: r 0.9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .t1 { font-size: 15px; }
  .t2 { font-size: 12px; color: #a8a29e; }
</style>
</head>
<body>
  <div class="spin"></div>
  <div class="t1">正在启动 x-code…</div>
  <div class="t2">首次启动需要初始化本地服务，通常几秒钟</div>
</body>
</html>
