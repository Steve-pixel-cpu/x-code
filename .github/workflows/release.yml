# 构建产物 → 自动发 Release (三平台)
#
# 触发:
#   - push v* 标签 (如 v3.3.9): 三平台并行构建 → 创建 GitHub Release
#     (Windows: NSIS 安装包; macOS: .dmg + 自动更新包 .app.tar.gz, 均带
#      更新签名; latest.json 含全部平台条目)
#   - workflow_dispatch (手动): 只构建 + 传 workflow artifact, 不发 Release
#
# 平台矩阵:
#   build-windows      windows-latest  NSIS 安装包 (build-exe.cmd tauri)
#   build-mac aarch64  macos-latest    Apple Silicon .dmg/.app.tar.gz
#   build-mac x64      macos-13        Intel .dmg/.app.tar.gz
# (PyInstaller 无法跨平台构建, mac arch 由 runner 决定)
#
# 签名: TAURI_SIGNING_PRIVATE_KEY / _PASSWORD 仓库 Secrets (minisign 密钥
# 跨平台通用); 缺失时构建照常成功, 只是没有 .sig (无自动更新条目)。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # 创建 Release / 上传产物

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # runner 管道 cp1252: 构建脚本/工具输出含中文, 强制 UTF-8（CI 首跑同款坑）
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Sync Python env
        run: uv sync

      # build-exe.cmd 的 tauri 分支不装 npm 依赖; 全量 npm install 会连
      # electron(~130MB) 一起拉, 这里只装 tauri-cli 且入全局（npx 走 PATH）
      - name: Install tauri-cli
        run: npm install --global @tauri-apps/cli@2

      - name: Compute version from tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: '"RELEASE_VERSION=$($env:GITHUB_REF_NAME -replace ''^v'','')" | Out-File $env:GITHUB_ENV -Append'

      - name: Build (PyInstaller backend + Tauri NSIS)
        shell: cmd
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if defined RELEASE_VERSION (build-exe.cmd tauri %RELEASE_VERSION%) else (build-exe.cmd tauri)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.sig

  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest     # Apple Silicon (arm64)
          - os: macos-13         # Intel (x64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compute version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build (PyInstaller backend + Tauri .app/.dmg)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-mac-tauri.sh "$RELEASE_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sig

  release:
    # 汇总: 下载三平台产物 → 合并生成多平台 latest.json → 创建 Release
    needs: [build-windows, build-mac]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate multi-platform latest.json
        run: node scripts/make-latest-multi.js --tag "$GITHUB_REF_NAME" --dist dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
